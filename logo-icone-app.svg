<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Juritel — icône d'application">
  <defs>
    <linearGradient id="jia-bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#181b30"/>
      <stop offset="1" stop-color="#33395f"/>
    </linearGradient>
    <!-- même dégradé exprimé dans le repère du groupe mis à l'échelle -->
    <linearGradient id="jia-bg-local" gradientUnits="userSpaceOnUse" x1="100.2" y1="7.3" x2="939.5" y2="846.6">
      <stop offset="0" stop-color="#181b30"/>
      <stop offset="1" stop-color="#33395f"/>
    </linearGradient>

    <!-- combiné AIGA renversé (fléau + plateaux), sombre sur le livre, blanc au dehors -->
    <g id="jia-fleau">
      <g stroke="none" transform="translate(602 272.4) scale(1.0925) rotate(90) translate(-86.5 -239.5)">
        <path d="M 84.363907 11.295609 C 92.083313 6.477264 100.590714 2.740402 109.62088 1.291367 C 109.94046 40.918396 109.622604 80.558365 109.779312 120.189346 C 110.122437 126.281006 110.045029 132.389557 109.91452 138.487595 C 103.803436 138.339203 97.721039 141.269257 94.183487 146.276611 C 88.513687 153.934097 86.57933 163.535248 84.970322 172.730469 C 81.552536 194.993317 80.777908 217.57225 80.993576 240.06543 C 81.280548 263.589554 83.321548 287.098129 86.932571 310.344925 C 88.624313 319.337692 90.181915 328.846069 95.590469 336.472687 C 98.794678 341.142807 104.391037 343.586227 109.973816 343.560104 C 110.028046 388.144745 109.994263 432.729874 109.990707 477.315094 C 100.642349 476.818481 91.836472 472.948593 83.962402 468.100037 C 63.764801 455.453552 48.771179 435.988434 37.636765 415.207657 C 18.488693 378.914978 9.911789 338.0634 5.856659 297.522781 C 3.744461 275.322998 2.980682 253.001648 3.340149 230.712372 C 4.230377 185.177231 9.030319 139.116104 24.083618 95.885666 C 30.69426 77.176758 39.374237 59.060379 51.160141 43.034683 C 60.233765 30.619522 71.280746 19.474518 84.363907 11.295609 Z"/>
        <path transform="translate(36 0)" d="M 120.004257 1.501587 C 132.988495 1.530502 145.975098 1.450104 158.958267 1.532028 C 165.411743 1.652588 171.100174 6.696594 172.530304 12.901886 C 172.647736 17.22876 172.882584 25.882492 173 30.209351 L 173 113.117493 C 172.138123 118.612839 173.932983 124.598572 171.400635 129.769073 C 169.188431 134.93486 163.753799 138.496735 158.134506 138.482742 C 145.425079 138.52887 132.714081 138.479782 120.004318 138.498459 C 119.99704 92.832733 119.997116 47.167252 120.004257 1.501587 Z"/>
        <path transform="translate(36 0)" d="M 120.004395 343.501617 C 132.96376 343.52742 145.925293 343.454361 158.883713 343.528549 C 165.378845 343.615204 171.119751 348.690964 172.538452 354.941208 C 172.653839 359.198151 172.884613 367.712036 173 371.968964 L 173 452.05925 C 172.157257 458.107269 174.143097 464.980057 170.571701 470.412415 C 167.839935 475.099411 162.395111 477.599457 157.073883 477.471298 C 144.717957 477.542236 132.360489 477.472595 120.004257 477.498489 C 119.997192 432.832581 119.996918 388.167114 120.004395 343.501617 Z"/>
      </g>
      <!-- cordelettes triangulaires de suspension -->
      <path d="M 417 286 L 351.3 350.6 M 417 286 L 482.4 350.6" fill="none" stroke-width="8" stroke-linecap="round"/>
      <path d="M 787.2 286 L 721.6 350.6 M 787.2 286 L 852.7 350.6" fill="none" stroke-width="8" stroke-linecap="round"/>
    </g>

    <clipPath id="jia-livre">
      <rect x="240" y="122" width="338" height="540" rx="26"/>
      <rect x="240" y="638" width="396" height="62" rx="31"/>
      <rect x="240" y="686" width="468" height="46" rx="23"/>
    </clipPath>
    <mask id="jia-dehors">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="240" y="122" width="338" height="540" rx="26" fill="#000"/>
      <rect x="240" y="638" width="396" height="62" rx="31" fill="#000"/>
      <rect x="240" y="686" width="468" height="46" rx="23" fill="#000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#jia-bg)"/>

  <g transform="translate(-122.2 -8.9) scale(1.22)">
    <!-- bloc de pages en deux épaisseurs -->
    <rect x="240" y="638" width="396" height="62" rx="31" fill="#ffffff" stroke="url(#jia-bg-local)" stroke-width="12"/>
    <rect x="240" y="686" width="468" height="46" rx="23" fill="#ffffff" stroke="url(#jia-bg-local)" stroke-width="12"/>

    <!-- couverture -->
    <rect x="240" y="122" width="338" height="540" rx="26" fill="#ffffff"/>
    <!-- marge de reliure -->
    <rect x="296" y="150" width="8" height="484" rx="4" fill="url(#jia-bg-local)"/>

    <!-- anneaux dans leurs encoches -->
    <g>
      <rect x="232" y="177" width="56" height="56" rx="28" fill="url(#jia-bg-local)"/>
      <rect x="232" y="292" width="56" height="56" rx="28" fill="url(#jia-bg-local)"/>
      <rect x="232" y="407" width="56" height="56" rx="28" fill="url(#jia-bg-local)"/>
      <rect x="232" y="522" width="56" height="56" rx="28" fill="url(#jia-bg-local)"/>
      <rect x="204" y="185" width="64" height="40" rx="20" fill="#ffffff"/>
      <rect x="204" y="300" width="64" height="40" rx="20" fill="#ffffff"/>
      <rect x="204" y="415" width="64" height="40" rx="20" fill="#ffffff"/>
      <rect x="204" y="530" width="64" height="40" rx="20" fill="#ffffff"/>
    </g>

    <!-- étiquette -->
    <rect x="351" y="545" width="180" height="70" rx="12" fill="#ffffff" stroke="url(#jia-bg-local)" stroke-width="10"/>
    <rect x="381" y="572" width="120" height="16" rx="8" fill="url(#jia-bg-local)"/>

    <!-- colonne-support (derrière le combiné) -->
    <rect x="576.7" y="260.9" width="50.6" height="368" fill="#ffffff" stroke="url(#jia-bg-local)" stroke-width="11"/>

    <!-- combiné : parties inversées -->
    <use href="#jia-fleau" clip-path="url(#jia-livre)" fill="url(#jia-bg-local)" stroke="url(#jia-bg-local)"/>
    <use href="#jia-fleau" mask="url(#jia-dehors)" fill="#ffffff" stroke="#ffffff"/>

    <!-- délimitation entre le combiné et la tige -->
    <rect x="576.7" y="268" width="50.6" height="11" fill="url(#jia-bg-local)"/>

    <!-- socle -->
    <g fill="#ffffff" stroke="url(#jia-bg-local)" stroke-width="11" stroke-linejoin="round">
      <rect x="518" y="628.9" width="170" height="39" rx="19"/>
      <rect x="467.5" y="668" width="271.5" height="46" rx="23"/>
    </g>
  </g>
</svg>
