# Régénère chaque mois les données officielles embarquées (annuaire DILA et table
# des compétences data.gouv), puis commite si quelque chose a changé.
# Déclenchement manuel possible : onglet Actions > « Données officielles » > Run workflow.
name: Données officielles

on:
  schedule:
    - cron: '17 4 2 * *'   # le 2 de chaque mois, 04h17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Annuaire officiel (DILA)
        run: python tools/build_officiel.py officiel.json

      - name: Table des compétences (data.gouv)
        run: python tools/build_competences.py competences.json

      - name: Résumé des changements
        run: |
          git diff --stat -- officiel.json competences.json || true

      - name: Commiter si changement
        run: |
          if [ -z "$(git status --porcelain -- officiel.json competences.json)" ]; then
            echo "Aucun changement : rien à commiter."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add officiel.json competences.json
          git commit -m "Données officielles régénérées (annuaire DILA, compétences data.gouv)"
          git push
