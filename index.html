<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annuaire Justice</title>
<meta name="theme-color" content="#141e3c">
<style>
/* ==================== design system ==================== */
:root{
  --bg:#eef0f6; --bg-grad:linear-gradient(180deg,#e9ecf5 0%,#f2f3f8 340px);
  --card:#ffffff; --card-2:#f7f8fc;
  --ink:#16192c; --ink-2:#5a607a; --ink-3:#9298ad;
  --line:#e4e7f0; --line-2:#eef0f6;
  --primary:#1e3a8a; --primary-2:#2f54c9; --accent:#b78a2e;
  --ok:#0d7a41; --ok-bg:#e2f6ea; --ko:#c02832; --ko-bg:#fdeaea;
  --chip-on:#16192c;
  --shadow-s:0 1px 2px rgba(22,25,44,.05),0 1px 3px rgba(22,25,44,.06);
  --shadow-m:0 2px 6px rgba(22,25,44,.06),0 10px 28px rgba(22,25,44,.09);
  --shadow-l:0 8px 22px rgba(22,25,44,.14),0 24px 60px rgba(22,25,44,.16);
  --r:16px;
  --tel:#2f54c9; --tel-bg:#e8edfd; --mail:#7a3fc0; --mail-bg:#f1e9fb;
  --fax:#5a607a; --fax-bg:#eceef4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1018; --bg-grad:linear-gradient(180deg,#121522 0%,#0e1018 340px);
    --card:#181b2a; --card-2:#1e2233;
    --ink:#e8eaf3; --ink-2:#a3a9c0; --ink-3:#6a7089;
    --line:#272b3f; --line-2:#20243646;
    --primary:#8fa6ff; --primary-2:#7d97f5; --accent:#d9b45a;
    --ok:#43c97c; --ok-bg:#12351f; --ko:#ff7b81; --ko-bg:#3a171b;
    --chip-on:#e8eaf3;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 8px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35);
    --shadow-l:0 12px 40px rgba(0,0,0,.55);
    --tel:#8fa6ff; --tel-bg:#1f2747; --mail:#c79bf2; --mail-bg:#32204b;
    --fax:#a3a9c0; --fax-bg:#232738;
  }
}
*{box-sizing:border-box; margin:0}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,sans-serif;
  background:var(--bg); background-image:var(--bg-grad); background-repeat:no-repeat;
  color:var(--ink); padding-bottom:90px; min-height:100vh;
  font-feature-settings:"cv05","tnum";
}
button{font-family:inherit}

/* ==================== en-tête ==================== */
header{
  position:sticky; top:0; z-index:20; padding:12px 16px 10px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:980px; margin:0 auto}
.titrebar{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.logo{
  width:38px; height:38px; border-radius:11px; flex-shrink:0;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);
  display:grid; place-items:center; font-size:19px; color:#fff;
  box-shadow:var(--shadow-s);
}
.titrebar h1{font-size:17px; font-weight:750; letter-spacing:-.01em; flex:1; min-width:0}
.titrebar h1 small{display:block; font-size:12px; font-weight:450; color:var(--ink-3); letter-spacing:0}
#syncstate{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3);
  padding:5px 10px; border-radius:20px; background:var(--card); border:1px solid var(--line)}
#syncstate .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
#syncstate.on .dot{background:var(--ok)}
#syncstate.err .dot{background:var(--ko)}
#syncstate.work .dot{background:var(--accent); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.iconbtn{
  width:38px; height:38px; border-radius:11px; border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); font-size:16px; cursor:pointer;
  display:grid; place-items:center; transition:all .15s;
}
.iconbtn:hover{color:var(--ink); box-shadow:var(--shadow-s); transform:translateY(-1px)}

.searchwrap{position:relative}
.searchwrap .lens{position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--ink-3); font-size:15px; pointer-events:none}
#q{
  width:100%; padding:14px 44px 14px 44px; font-size:16px; color:var(--ink);
  border:1.5px solid var(--line); border-radius:16px; background:var(--card);
  outline:none; box-shadow:var(--shadow-s); transition:border-color .15s, box-shadow .15s;
}
#q::placeholder{color:var(--ink-3)}
#q:focus{border-color:var(--primary-2); box-shadow:0 0 0 4px color-mix(in srgb, var(--primary-2) 14%, transparent), var(--shadow-s)}
#clearq{position:absolute; right:8px; top:50%; transform:translateY(-50%);
  border:none; background:var(--line-2); color:var(--ink-2); cursor:pointer;
  width:30px; height:30px; border-radius:50%; font-size:13px; display:none}
#clearq:hover{background:var(--line)}

.chips{display:flex; gap:7px; overflow-x:auto; padding:10px 2px 2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--ink-2);
  border-radius:20px; padding:5px 13px; font-size:13px; font-weight:550;
  cursor:pointer; white-space:nowrap; transition:all .15s;
}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--chip-on); color:var(--bg); border-color:var(--chip-on)}

/* ==================== contenu ==================== */
main{max-width:980px; margin:0 auto; padding:14px 16px}
#stats{color:var(--ink-3); font-size:13px; margin:2px 4px 12px; font-weight:500}

.jur{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  margin-bottom:12px; box-shadow:var(--shadow-s); overflow:hidden;
  transition:box-shadow .2s;
}
.jur:hover{box-shadow:var(--shadow-m)}
.jurhead{
  display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer;
  user-select:none;
}
.jurhead .nom{font-weight:700; font-size:15.5px; flex:1; min-width:0; letter-spacing:-.005em}
.jurhead .adr{display:block; font-size:12.5px; color:var(--ink-3); font-weight:450; margin-top:1px}
.jmeta{display:flex; align-items:center; gap:8px; flex-shrink:0}
.badge{
  font-size:10.5px; font-weight:700; padding:3.5px 9px; border-radius:8px;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;
}
.b-tj{color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.b-ca{color:#7a3fc0; background:var(--mail-bg)}
.b-cassation{color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent)}
.b-penitentiaire{color:#a05a1c; background:#f8ecdd}
.b-commissariat{color:#0f6f8a; background:#e0f2f8}
.b-cra{color:#0f8a68; background:#def4ec}
.b-prefecture,.b-douane,.b-etranger,.b-commerce,.b-autre{color:var(--ink-2); background:var(--line-2)}
@media (prefers-color-scheme: dark){
  .b-penitentiaire{background:#3a2a14} .b-commissariat{background:#12303a} .b-cra{background:#123329}
}
.ncontacts{font-size:12px; color:var(--ink-3); font-weight:600; font-variant-numeric:tabular-nums}
.caret{color:var(--ink-3); font-size:11px; transition:transform .2s; flex-shrink:0}
.jur.open .caret{transform:rotate(90deg)}
.jurbody{display:none; border-top:1px solid var(--line-2); background:var(--card-2); padding:6px 10px 10px}
.jur.open .jurbody{display:block}
.jurfoot{display:flex; gap:6px; padding:8px 6px 2px}

/* services */
.svc{background:var(--card); border:1px solid var(--line-2); border-radius:12px;
  margin:8px 0; overflow:hidden; box-shadow:var(--shadow-s)}
.svchead{
  display:flex; align-items:center; gap:8px; padding:10px 14px; cursor:pointer;
  user-select:none;
}
.svchead .n{
  flex:1; min-width:0; font-size:12.5px; font-weight:750; color:var(--primary);
  text-transform:uppercase; letter-spacing:.06em;
}
.svchead .cnt{font-size:11.5px; color:var(--ink-3); font-weight:600; font-variant-numeric:tabular-nums}
.svc .caret{font-size:10px}
.svc.open .caret{transform:rotate(90deg)}
.svcbody{display:none; padding:0 8px 8px}
.svc.open .svcbody{display:block}

/* volets (sous-sections) */
.volet{border:1px solid var(--line-2); border-radius:10px; margin:6px 0; overflow:hidden;
  background:var(--card)}
.volethead{
  display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer;
  user-select:none; background:var(--card-2);
}
.volethead .n{flex:1; min-width:0; font-size:13px; font-weight:650; color:var(--ink)}
.volethead .cnt{font-size:11px; color:var(--ink-3); font-weight:600}
.volet .caret{font-size:9px}
.volet.open .caret{transform:rotate(90deg)}
.voletbody{display:none}
.volet.open .voletbody{display:block}

/* lignes de contact */
.ct{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border-top:1px solid var(--line-2); position:relative;
}
.ct:first-child{border-top:none}
.ct.dead{opacity:.45}
.ct .tico{
  width:32px; height:32px; border-radius:9px; display:grid; place-items:center;
  font-size:14px; flex-shrink:0;
}
.tico.tel{background:var(--tel-bg); color:var(--tel)}
.tico.email{background:var(--mail-bg); color:var(--mail)}
.tico.fax{background:var(--fax-bg); color:var(--fax)}
.ct .info{flex:1; min-width:0}
.ct .val{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.ct .val a{
  font-weight:650; color:var(--ink); text-decoration:none; font-size:14.5px;
  font-variant-numeric:tabular-nums; letter-spacing:.01em; word-break:break-all;
}
.ct .val a:hover{color:var(--primary-2)}
.ct .lib{font-size:12.5px; color:var(--ink-2); margin-top:1px;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.ct .note{font-size:12px; color:var(--ink-3); font-style:italic; margin-top:3px;
  padding:5px 8px; background:var(--card-2); border-radius:7px; display:none}
.ct.shownote .note{display:block}
.score{font-size:11px; font-weight:700; border-radius:8px; padding:2.5px 8px;
  white-space:nowrap; font-variant-numeric:tabular-nums}
.score.good{color:var(--ok); background:var(--ok-bg)}
.score.bad{color:var(--ko); background:var(--ko-bg)}
.ct .acts{display:flex; align-items:center; gap:4px; flex-shrink:0}
.abtn{
  width:30px; height:30px; border-radius:8px; border:1px solid transparent;
  background:none; color:var(--ink-3); cursor:pointer; font-size:13px;
  display:grid; place-items:center; transition:all .12s;
}
.abtn:hover{background:var(--line-2); color:var(--ink)}
.abtn.rok:hover{background:var(--ok-bg); color:var(--ok); border-color:color-mix(in srgb, var(--ok) 30%, transparent)}
.abtn.rko:hover{background:var(--ko-bg); color:var(--ko); border-color:color-mix(in srgb, var(--ko) 30%, transparent)}
@media (hover:hover){
  .ct .acts .ghost{opacity:0; transition:opacity .15s}
  .ct:hover .acts .ghost{opacity:1}
}
.mini{
  border:none; background:none; color:var(--ink-3); cursor:pointer; font-size:12.5px;
  padding:5px 10px; border-radius:8px; font-weight:550;
}
.mini:hover{background:var(--line-2); color:var(--ink)}
.more{
  display:block; width:100%; padding:13px; margin:4px 0 24px;
  border:1.5px dashed var(--line); background:none; color:var(--primary-2);
  border-radius:var(--r); cursor:pointer; font-size:14px; font-weight:600;
}
.more:hover{background:var(--card)}
.vide{text-align:center; color:var(--ink-3); padding:60px 10px}
.vide .big{font-size:40px; margin-bottom:10px}

/* ==================== bouton flottant ==================== */
#fab{
  position:fixed; right:20px; bottom:20px; z-index:30;
  height:54px; padding:0 22px 0 18px; border-radius:27px; border:none;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);
  color:#fff; font-size:15px; font-weight:650; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  box-shadow:var(--shadow-l); transition:transform .15s;
}
#fab:hover{transform:translateY(-2px) scale(1.02)}
#fab span{font-size:22px; font-weight:400; line-height:1}

/* ==================== dialogues ==================== */
dialog{
  border:none; border-radius:20px; padding:0; max-width:500px; width:calc(100vw - 32px);
  background:var(--card); color:var(--ink); box-shadow:var(--shadow-l);
  max-height:88vh;
}
dialog::backdrop{background:rgba(10,12,26,.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.dlg{padding:22px}
.dlg h2{font-size:17px; font-weight:750; margin-bottom:16px; letter-spacing:-.01em}
.dlg label{display:block; font-size:12px; font-weight:650; margin:12px 0 5px;
  color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em}
.dlg label .hint{text-transform:none; letter-spacing:0; font-weight:450}
.dlg input,.dlg select,.dlg textarea{
  width:100%; padding:10px 12px; font-size:15px; color:var(--ink);
  border:1.5px solid var(--line); border-radius:10px; background:var(--card-2);
  outline:none; font-family:inherit; transition:border-color .15s;
}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--primary-2)}
.dlgbtns{display:flex; gap:8px; justify-content:flex-end; margin-top:20px}
.btn{
  padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600;
  cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);
  transition:all .15s;
}
.btn:hover{box-shadow:var(--shadow-s)}
.btn.primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff; border:none;
}
.btn.danger{color:var(--ko); border-color:color-mix(in srgb, var(--ko) 40%, transparent)}
.setrow{display:flex; align-items:center; gap:8px; margin:8px 0}
.setrow .btn{flex:1}
hr{border:none; border-top:1px solid var(--line); margin:16px 0}
.hint{font-size:12px; color:var(--ink-3); line-height:1.5}

#toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:12px;
  font-size:14px; font-weight:550; opacity:0; pointer-events:none;
  transition:all .25s; z-index:40; max-width:90vw; text-align:center;
  box-shadow:var(--shadow-l);
}
#toast.show{opacity:.97; transform:translateX(-50%) translateY(0)}

@media (max-width:560px){
  .titrebar h1 small{display:none}
  .jurhead{padding:12px 12px}
  .ct{padding:8px 6px}
  #fab{padding:0; width:54px; justify-content:center}
  #fab b{display:none}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="titrebar">
    <div class="logo">⚖️</div>
    <h1>Annuaire Justice<small id="count"></small></h1>
    <div id="syncstate" title="Synchronisation"><span class="dot"></span><span id="synctxt">local</span></div>
    <button class="iconbtn" id="btnsettings" title="Réglages">⚙</button>
  </div>
  <div class="searchwrap">
    <span class="lens">🔍</span>
    <input id="q" type="search" placeholder="Ville, juridiction, service, numéro, mail…"
      autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="clearq" title="Effacer">✕</button>
  </div>
  <div class="chips" id="chips"></div>
</div></header>

<main>
  <div id="stats"></div>
  <div id="results"></div>
</main>

<button id="fab" title="Ajouter un contact"><span>＋</span><b>Ajouter</b></button>
<div id="toast"></div>

<!-- ============ dialogue ajout / édition ============ -->
<dialog id="dlgAdd"><form class="dlg" method="dialog" id="formAdd">
  <h2 id="addTitle">Ajouter un contact</h2>
  <label>Juridiction</label>
  <input id="fJur" list="listJur" placeholder="TJ Melun, CA Paris… (créée si inconnue)" required>
  <datalist id="listJur"></datalist>
  <label>Catégorie <span class="hint">(si nouvelle juridiction)</span></label>
  <select id="fCat">
    <option value="tj">Tribunal judiciaire</option>
    <option value="ca">Cour d'appel</option>
    <option value="cassation">Cour de cassation</option>
    <option value="penitentiaire">Établissement pénitentiaire</option>
    <option value="commissariat">Commissariat</option>
    <option value="cra">CRA</option>
    <option value="prefecture">Préfecture</option>
    <option value="douane">Douanes</option>
    <option value="autre">Autre</option>
  </select>
  <label>Service / greffe</label>
  <input id="fSvc" list="listSvc" placeholder="Greffe correctionnel, Parquet, JAF…">
  <datalist id="listSvc"></datalist>
  <label>Bureau / volet <span class="hint">(facultatif — ex. Bureau d'ordre pénal)</span></label>
  <input id="fGrp" list="listGrp" placeholder="">
  <datalist id="listGrp"></datalist>
  <label>Type</label>
  <select id="fType">
    <option value="tel">📞 Téléphone</option>
    <option value="email">✉️ Email</option>
    <option value="fax">📠 Fax</option>
  </select>
  <label>Numéro ou adresse mail</label>
  <input id="fVal" placeholder="01 23 45 67 89 ou greffe@justice.fr" required>
  <label>Libellé <span class="hint">(à quoi sert ce contact)</span></label>
  <input id="fLib" placeholder="Greffe de la 3e chambre…">
  <label>Note <span class="hint">(facultatif)</span></label>
  <textarea id="fNote" rows="2" placeholder="Précisions, horaires, interlocuteur…"></textarea>
  <div class="dlgbtns">
    <button class="btn" value="cancel" formnovalidate>Annuler</button>
    <button class="btn primary" value="ok" id="addOk">Ajouter</button>
  </div>
</form></dialog>

<!-- ============ réglages ============ -->
<dialog id="dlgSettings"><div class="dlg">
  <h2>Réglages</h2>
  <div class="setrow"><button class="btn" id="btnExport">⬇️ Exporter les données (JSON)</button></div>
  <div class="setrow"><button class="btn" id="btnImport">⬆️ Importer un fichier JSON</button>
    <input type="file" id="fileImport" accept=".json" hidden></div>
  <hr>
  <div id="driveBox">
    <div class="setrow"><button class="btn primary" id="btnDrive">☁️ Connecter Google Drive</button></div>
    <div class="setrow" style="display:none" id="rowDriveOff"><button class="btn" id="btnDriveOff">Déconnecter Google Drive</button></div>
    <p class="hint" id="driveHint"></p>
  </div>
  <hr>
  <p class="hint" id="metaInfo"></p>
  <div class="dlgbtns"><button class="btn primary" id="btnCloseSettings">Fermer</button></div>
</div></dialog>

<script>
'use strict';
/* ============================================================
   CONFIG — synchronisation Google Drive
   Renseigner CLIENT_ID (console Google Cloud, identifiant OAuth
   « application Web ») pour activer la synchronisation.
   ============================================================ */
const CLIENT_ID = '1002386733501-oeq2g899a2dlgcttg0qem8a7ugvsh847.apps.googleusercontent.com';
const DRIVE_FILENAME = 'annuaire-justice-data.json';
const LS_KEY = 'annuaireJustice.data';
const LS_DRIVE = 'annuaireJustice.driveOn';
const LS_FILEID = 'annuaireJustice.driveFileId';

/* ============================ état ============================ */
let DATA = null;
let currentCat = '';
let shownGroups = 30;
const openState = {};      // id -> bool (juridictions, services, volets)
const $ = s => document.querySelector(s);

const CATS = {
  tj:'Tribunaux judiciaires', ca:"Cours d'appel", cassation:'Cassation',
  penitentiaire:'Pénitentiaire', commissariat:'Commissariats', cra:'CRA',
  prefecture:'Préfectures', douane:'Douanes', etranger:'Étranger',
  commerce:'Commerce', autre:'Autres'
};
const CAT_LABEL = {
  tj:'TJ', ca:'CA', cassation:'Cass.', penitentiaire:'Prison',
  commissariat:'Police', cra:'CRA', prefecture:'Préf.', douane:'Douane',
  etranger:'Étranger', commerce:'T.Com', autre:'Autre'
};

/* ============================ utilitaires ============================ */
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const digits = s => (s||'').replace(/\D/g,'');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
function fmtDate(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'2-digit'});
}

/* ============================ persistance ============================ */
function save(){
  DATA.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }
  catch(e){ toast('⚠️ Stockage local plein : '+e.message); }
  Drive.schedulePush();
}
async function load(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ DATA = JSON.parse(raw); }catch(e){} }
  if(!DATA){
    try{
      const r = await fetch('annuaire.json', {cache:'no-cache'});
      if(r.ok) DATA = await r.json();
    }catch(e){}
    if(!DATA) DATA = {version:1, juridictions:[]};
    DATA.tombstones = DATA.tombstones||{};
    DATA.updatedAt = Date.now();
    try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){}
  }
  DATA.tombstones = DATA.tombstones||{};
  buildIndex();
}

/* ============================ index de recherche ============================ */
function buildIndex(){
  for(const j of DATA.juridictions){
    j._txt = norm(j.nom+' '+(CATS[j.categorie]||'')+' '+j.categorie+' '+(j.adresse||''));
    for(const s of j.services){
      s._txt = norm(s.nom);
      for(const c of s.contacts){
        c._txt = norm((c.libelle||'')+' '+(c.groupe||'')+' '+c.valeur+' '+(c.note||''));
        c._dig = c.type==='email' ? '' : digits(c.valeur);
      }
    }
  }
}

/* ============================ notation / tri ============================ */
const NOW = () => Date.now();
const J90 = 90*24*3600*1000;
function score(c){
  let s = (c.ok||0)*3 - (c.ko||0)*2;
  if(c.lastOk && NOW()-c.lastOk < J90) s += 100;
  else if(c.lastOk) s += 40;
  return s;
}
const isDead = c => (c.ko||0)>=3 && !(c.ok>0);
const sortContacts = list => [...list].sort((a,b)=>score(b)-score(a));

/* ============================ recherche ============================ */
function search(){
  const tokens = norm($('#q').value.trim()).split(/\s+/).filter(Boolean);
  const results = [];
  for(const j of DATA.juridictions){
    if(currentCat && j.categorie!==currentCat) continue;
    if(!tokens.length){ results.push({j, svcs:null}); continue; }
    const rest = tokens.filter(t=>!j._txt.includes(t));
    if(!rest.length){ results.push({j, svcs:null}); continue; }
    const svcs = [];
    for(const s of j.services){
      const rest2 = rest.filter(t=>!s._txt.includes(t));
      const cts = s.contacts.filter(c =>
        rest2.every(t => c._txt.includes(t) ||
          (c._dig && digits(t).length>=4 && c._dig.includes(digits(t)))));
      if(cts.length) svcs.push({s, cts});
    }
    if(svcs.length) results.push({j, svcs});
  }
  return {results, tokens};
}

/* ============================ rendu ============================ */
function render(){
  const {results, tokens} = search();
  const R = $('#results');
  const total = DATA.juridictions.length;
  const nc = DATA.juridictions.reduce((n,j)=>n+j.services.reduce((m,s)=>m+s.contacts.length,0),0);
  $('#count').textContent = `${total} juridictions · ${nc.toLocaleString('fr-FR')} contacts`;
  $('#stats').textContent = tokens.length||currentCat ?
    `${results.length} juridiction${results.length>1?'s':''} trouvée${results.length>1?'s':''}` :
    `Tapez une ville, un service, un numéro ou un mail pour rechercher`;
  $('#clearq').style.display = $('#q').value ? 'block':'none';

  if(!results.length){
    R.innerHTML = `<div class="vide"><div class="big">🔍</div>Aucun résultat.<br><br>
      <button class="btn primary" onclick="openAdd()">＋ Ajouter ce contact</button></div>`;
    return;
  }
  const searching = tokens.length>0;
  let html = '';
  for(const r of results.slice(0, shownGroups)) html += renderJur(r, searching);
  R.innerHTML = html;
  if(results.length > shownGroups)
    R.innerHTML += `<button class="more" onclick="shownGroups+=40;render()">Afficher ${results.length-shownGroups} juridictions de plus</button>`;
}

function isOpen(id, dflt){ return openState[id]!==undefined ? openState[id] : dflt; }

function renderJur({j, svcs}, searching){
  const nc = j.services.reduce((m,s)=>m+s.contacts.length,0);
  const open = isOpen(j.id, searching);
  let body = '';
  if(open){
    const list = svcs || j.services.map(s=>({s, cts:s.contacts}));
    for(const {s, cts} of list) body += renderSvc(j, s, cts, searching, list.length===1);
    body = `<div class="jurbody">${body}
      <div class="jurfoot">
        <button class="mini" onclick="openAdd('${j.id}')">＋ Ajouter un contact</button>
        <button class="mini" onclick="delJur('${j.id}')">Supprimer la juridiction</button>
      </div></div>`;
  }
  return `<div class="jur ${open?'open':''}">
    <div class="jurhead" onclick="tgl('${j.id}', ${searching})">
      <span class="caret">▶</span>
      <span class="nom">${esc(j.nom)}${j.adresse?`<span class="adr">${esc(j.adresse)}</span>`:''}</span>
      <span class="jmeta">
        <span class="badge b-${j.categorie}">${CAT_LABEL[j.categorie]||j.categorie}</span>
        <span class="ncontacts">${nc}</span>
      </span>
    </div>${body}</div>`;
}

function renderSvc(j, s, cts, searching, solo){
  const open = isOpen(s.id, searching || solo || cts.length<=8);
  let body = '';
  if(open){
    // regrouper par volet (champ groupe) ; les libellés identiques à un
    // groupe existant rejoignent ce volet
    const groups = new Map(); const root = [];
    const gkeys = new Set(cts.filter(c=>c.groupe).map(c=>norm(c.groupe)));
    for(const c of cts){
      const gk = c.groupe ? norm(c.groupe) : (gkeys.has(norm(c.libelle||'')) ? norm(c.libelle) : '');
      if(gk){
        if(!groups.has(gk)) groups.set(gk, {nom:c.groupe||c.libelle, rows:[]});
        groups.get(gk).rows.push(c);
      } else root.push(c);
    }
    for(const c of sortContacts(root)) body += renderContact(j, s, c, false);
    for(const [gk, g] of groups){
      const vid = s.id+'|'+gk;
      const vopen = isOpen(vid, searching || groups.size<=2);
      let rows = '';
      if(vopen) for(const c of sortContacts(g.rows)) rows += renderContact(j, s, c, true, g.nom);
      body += `<div class="volet ${vopen?'open':''}">
        <div class="volethead" onclick="tgl('${esc(vid)}', ${vopen})">
          <span class="caret">▶</span><span class="n">${esc(g.nom)}</span>
          <span class="cnt">${g.rows.length}</span>
        </div><div class="voletbody">${rows}</div></div>`;
    }
    body = `<div class="svcbody">${body}</div>`;
  }
  return `<div class="svc ${open?'open':''}">
    <div class="svchead" onclick="tgl('${s.id}', ${open})">
      <span class="caret">▶</span>
      <span class="n">${esc(s.nom)}</span>
      <span class="cnt">${cts.length}</span>
      <button class="mini" title="Ajouter ici" onclick="event.stopPropagation();openAdd('${j.id}','${s.id}')">＋</button>
      <button class="mini" title="Supprimer ce service" onclick="event.stopPropagation();delService('${j.id}','${s.id}')">🗑</button>
    </div>${body}</div>`;
}

function renderContact(j, s, c, inVolet, voletNom){
  const href = c.type==='email' ? 'mailto:'+c.valeur :
    'tel:'+(digits(c.valeur).length===10 ? '+33'+digits(c.valeur).slice(1) : digits(c.valeur));
  const ic = c.type==='email' ? '✉️' : c.type==='fax' ? '📠' : '📞';
  let badge = '';
  if(c.ok>0) badge = `<span class="score good" title="${c.ok} appel(s) réussi(s)${c.lastOk?', dernier le '+fmtDate(c.lastOk):''}">✓ ${c.ok}${c.lastOk?' · '+fmtDate(c.lastOk):''}</span>`;
  else if(c.ko>0) badge = `<span class="score bad" title="${c.ko} échec(s)">✗ ${c.ko}</span>`;
  let lib = c.libelle||'';
  if(inVolet && norm(lib)===norm(voletNom||'')) lib = '';
  return `<div class="ct ${isDead(c)?'dead':''}" id="ct-${c.id}">
    <span class="tico ${c.type}">${ic}</span>
    <div class="info">
      <div class="val"><a href="${href}" ${c.type==='fax'?'onclick="return false"':''}>${esc(c.valeur)}</a>${badge}</div>
      ${lib?`<div class="lib">${esc(lib)}</div>`:''}
      ${c.note?`<div class="note">${esc(c.note)}</div>`:''}
    </div>
    <div class="acts">
      ${c.note?`<button class="abtn ghost" title="Note" onclick="this.closest('.ct').classList.toggle('shownote')">ℹ</button>`:''}
      <button class="abtn ghost" title="Copier" onclick="copyVal('${esc(c.valeur)}')">⧉</button>
      <button class="abtn ghost" title="Modifier" onclick="openEdit('${c.id}')">✎</button>
      <button class="abtn ghost" title="Supprimer" onclick="delContact('${c.id}')">🗑</button>
      <button class="abtn rok" title="Ça a répondu" onclick="rate('${c.id}',1)">✓</button>
      <button class="abtn rko" title="Ne répond pas" onclick="rate('${c.id}',0)">✗</button>
    </div>
  </div>`;
}

function renderChips(){
  const counts = {};
  for(const j of DATA.juridictions) counts[j.categorie]=(counts[j.categorie]||0)+1;
  let html = `<button class="chip ${!currentCat?'on':''}" onclick="setCat('')">Tout</button>`;
  for(const [k,v] of Object.entries(CATS)){
    if(!counts[k]) continue;
    html += `<button class="chip ${currentCat===k?'on':''}" onclick="setCat('${k}')">${v} · ${counts[k]}</button>`;
  }
  $('#chips').innerHTML = html;
}

/* ============================ interactions ============================ */
window.setCat = c => { currentCat=c; shownGroups=30; renderChips(); render(); };
window.tgl = (id, cur) => { openState[id] = !cur; render(); };
window.copyVal = v => { navigator.clipboard?.writeText(v).then(()=>toast('Copié : '+v)); };

function findContact(id){
  for(const j of DATA.juridictions) for(const s of j.services)
    for(const c of s.contacts) if(c.id===id) return {j,s,c};
  return null;
}
window.rate = (id, ok) => {
  const f = findContact(id); if(!f) return;
  if(ok){ f.c.ok=(f.c.ok||0)+1; f.c.lastOk=NOW(); toast('✓ Noté : ce numéro répond'); }
  else { f.c.ko=(f.c.ko||0)+1; toast('✗ Échec noté'); }
  f.c.lastTry=NOW(); f.c.u=NOW();
  save(); render();
};
window.delContact = id => {
  const f = findContact(id); if(!f) return;
  if(!confirm(`Supprimer ${f.c.valeur} (${f.c.libelle||f.s.nom}) ?`)) return;
  f.s.contacts = f.s.contacts.filter(c=>c.id!==id);
  DATA.tombstones[id]=NOW();
  save(); render(); toast('Contact supprimé');
};
window.delService = (jid,sid) => {
  const j = DATA.juridictions.find(x=>x.id===jid); if(!j) return;
  const s = j.services.find(x=>x.id===sid); if(!s) return;
  if(!confirm(`Supprimer le service « ${s.nom} » et ses ${s.contacts.length} contacts ?`)) return;
  for(const c of s.contacts) DATA.tombstones[c.id]=NOW();
  DATA.tombstones[sid]=NOW();
  j.services = j.services.filter(x=>x.id!==sid);
  save(); render(); toast('Service supprimé');
};
window.delJur = id => {
  const j = DATA.juridictions.find(x=>x.id===id); if(!j) return;
  const nc = j.services.reduce((m,s)=>m+s.contacts.length,0);
  if(!confirm(`Supprimer « ${j.nom} » et ses ${nc} contacts ?`)) return;
  for(const s of j.services){ for(const c of s.contacts) DATA.tombstones[c.id]=NOW(); DATA.tombstones[s.id]=NOW(); }
  DATA.tombstones[id]=NOW();
  DATA.juridictions = DATA.juridictions.filter(x=>x.id!==id);
  save(); renderChips(); render(); toast('Juridiction supprimée');
};

    s.contacts.push(c);

/* ============================================================
   SYNCHRONISATION GOOGLE DRIVE (scope drive.file)
   ============================================================ */
const Drive = (() => {
  let token=null, tokenClient=null, fileId=localStorage.getItem(LS_FILEID)||null;
  let pushTimer=null, busy=false, lastRemoteRev=null;
  const enabled = () => !!CLIENT_ID;
  const on = () => enabled() && localStorage.getItem(LS_DRIVE)==='1';

  function setState(cls, txt){
    $('#syncstate').className = cls; $('#synctxt').textContent = txt;
  }
  function refreshSettingsUI(){
    if(!enabled()){
      $('#btnDrive').style.display='none'; $('#rowDriveOff').style.display='none';
      $('#driveHint').textContent = 'Synchronisation Google Drive non configurée. Les données restent sur cet appareil ; utilisez Exporter/Importer pour les transférer.';
      return;
    }
    $('#btnDrive').style.display = on()?'none':'flex';
    $('#rowDriveOff').style.display = on()?'flex':'none';
    $('#driveHint').textContent = on() ?
      'Connecté : le fichier « '+DRIVE_FILENAME+' » de votre Drive est synchronisé automatiquement entre vos appareils.' :
      'Vos données seront stockées dans un fichier de votre Google Drive et synchronisées entre tous vos appareils.';
  }

  async function ensureToken(interactive){
    if(!enabled()) return null;
    if(token && token.exp > Date.now()+60000) return token.v;
    if(!window.google?.accounts?.oauth2){ setState('err','lib Google absente'); return null; }
    if(!tokenClient){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID, scope:'https://www.googleapis.com/auth/drive.file',
        callback:()=>{}});
    }
    return new Promise(resolve=>{
      tokenClient.callback = resp=>{
        if(resp.access_token){
          token = {v:resp.access_token, exp:Date.now()+(resp.expires_in-30)*1000};
          resolve(token.v);
        } else resolve(null);
      };
      try{ tokenClient.requestAccessToken({prompt: interactive?'consent':''}); }
      catch(e){ resolve(null); }
    });
  }
  const H = t => ({'Authorization':'Bearer '+t});
  const exportJson = () => JSON.stringify(DATA,(k,v)=>k.startsWith('_')?undefined:v);

  async function findOrCreate(t){
    if(fileId) return fileId;
    let r = await fetch('https://www.googleapis.com/drive/v3/files?q='+
      encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`)+'&fields=files(id)',{headers:H(t)});
    if(r.ok){ const d = await r.json(); if(d.files?.length) fileId = d.files[0].id; }
    if(!fileId){
      r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
        method:'POST', headers:{...H(t),'Content-Type':'multipart/related; boundary=BND'},
        body:`--BND\r\nContent-Type: application/json\r\n\r\n`+
          JSON.stringify({name:DRIVE_FILENAME, mimeType:'application/json'})+
          `\r\n--BND\r\nContent-Type: application/json\r\n\r\n`+exportJson()+`\r\n--BND--`});
      if(r.ok) fileId = (await r.json()).id;
    }
    if(fileId) localStorage.setItem(LS_FILEID, fileId);
    return fileId;
  }
  async function meta(t){
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=version,modifiedTime`,{headers:H(t)});
    return r.ok ? r.json() : null;
  }

  /* fusion : union par id, plus récent gagne, tombstones appliquées */
  function mergeData(remote){
    if(!remote || !Array.isArray(remote.juridictions)) return false;
    const tomb = {...(remote.tombstones||{}), ...DATA.tombstones};
    const byId = arr => Object.fromEntries(arr.map(x=>[x.id,x]));
    const newer = (a,b) => (a.u||0)>=(b.u||0) ? a : b;
    const jl = byId(DATA.juridictions);
    for(const rj of remote.juridictions){
      if(!jl[rj.id]){ jl[rj.id]=rj; continue; }
      const lj = jl[rj.id];
      const keep = newer(lj, rj);
      const sl = byId(lj.services);
      for(const rs of rj.services){
        if(!sl[rs.id]){ sl[rs.id]=rs; continue; }
        const ls = sl[rs.id];
        const cl = byId(ls.contacts);
        for(const rc of rs.contacts){
          if(!cl[rc.id]){ cl[rc.id]=rc; continue; }
          const lc = cl[rc.id];
          cl[rc.id] = {...newer(lc,rc),
            ok:Math.max(lc.ok||0,rc.ok||0), ko:Math.max(lc.ko||0,rc.ko||0),
            lastOk:Math.max(lc.lastOk||0,rc.lastOk||0)||null,
            lastTry:Math.max(lc.lastTry||0,rc.lastTry||0)||null};
        }
        ls.contacts = Object.values(cl);
        ls.nom = newer(ls,rs).nom;
      }
      lj.services = Object.values(sl);
      lj.nom = keep.nom; lj.categorie = keep.categorie; lj.adresse = keep.adresse;
    }
    let js = Object.values(jl).filter(j=>!(tomb[j.id]>(j.u||0)));
    for(const j of js){
      j.services = j.services.filter(s=>!(tomb[s.id]>(s.u||0)));
      for(const s of j.services)
        s.contacts = s.contacts.filter(c=>!(tomb[c.id]>(c.u||0)));
    }
    DATA.juridictions = js;
    DATA.tombstones = tomb;
    return true;
  }

  async function pull(interactive){
    if(!on()) return;
    const t = await ensureToken(interactive); if(!t){ setState('err','hors ligne'); return; }
    setState('work','sync…'); busy = true;
    try{
      if(!await findOrCreate(t)){ setState('err','erreur Drive'); return; }
      const m = await meta(t);
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{headers:H(t)});
      if(r.ok){
        const remote = await r.json().catch(()=>null);
        if(remote && mergeData(remote)){
          buildIndex();
          try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){}
          renderChips(); render();
        }
        lastRemoteRev = m?.version||null;
        await push(true);
        setState('on','synchronisé');
      } else setState('err','erreur lecture');
    } finally { busy = false; }
  }

  async function push(skipCheck){
    if(!on() || !fileId) return;
    const t = await ensureToken(false); if(!t){ setState('err','reconnexion requise'); return; }
    setState('work','envoi…');
    if(!skipCheck){
      const m = await meta(t);
      if(m && lastRemoteRev && m.version!==lastRemoteRev){ await pull(false); return; }
    }
    const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=version`,{
      method:'PATCH', headers:{...H(t),'Content-Type':'application/json'}, body:exportJson()});
    if(r.ok){ lastRemoteRev = (await r.json()).version; setState('on','synchronisé'); }
    else setState('err','erreur envoi');
  }

  function schedulePush(){
    if(!on()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(()=>{ if(!busy) push(false); }, 2500);
  }
  async function connect(){
    const t = await ensureToken(true);
    if(!t){ toast('Connexion Google refusée'); return; }
    localStorage.setItem(LS_DRIVE,'1');
    refreshSettingsUI();
    await pull(false);
    toast('Google Drive connecté ☁️');
  }
  function disconnect(){
    localStorage.removeItem(LS_DRIVE); localStorage.removeItem(LS_FILEID);
    fileId=null; token=null;
    setState('','local'); refreshSettingsUI();
  }
  function init(){
    if(!enabled()){ setState('','local'); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = ()=>{ if(on()) pull(false); };
    document.head.appendChild(s);
    if(!on()) setState('','local');
    document.addEventListener('visibilitychange', ()=>{
      if(!document.hidden && on() && !busy) pull(false);
    });
    setInterval(()=>{ if(on() && !busy && !document.hidden) pull(false); }, 5*60*1000);
  }
  return {init, connect, disconnect, schedulePush, refreshSettingsUI};
})();
$('#btnDrive').addEventListener('click', ()=>Drive.connect());
$('#btnDriveOff').addEventListener('click', ()=>{ Drive.disconnect(); toast('Drive déconnecté'); });

/* ============================ démarrage ============================ */
(async function(){
  await load();
  renderChips(); render();
  Drive.init();
})();
</script>
