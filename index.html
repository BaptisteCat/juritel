<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Annuaire Justice</title>
<meta name="theme-color" content="#141e3c">
<style>
/* ==================== design system ==================== */
:root{
  --bg:#eef0f6; --bg-grad:linear-gradient(180deg,#e9ecf5 0%,#f2f3f8 340px);
  --card:#ffffff; --card-2:#f7f8fc;
  --ink:#16192c; --ink-2:#5a607a; --ink-3:#9298ad;
  --line:#e4e7f0; --line-2:#eef0f6;
  --primary:#1e3a8a; --primary-2:#2f54c9; --accent:#b78a2e;
  --ok:#0d7a41; --ok-bg:#e2f6ea; --ko:#c02832; --ko-bg:#fdeaea;
  --chip-on:#16192c;
  --shadow-s:0 1px 2px rgba(22,25,44,.05),0 1px 3px rgba(22,25,44,.06);
  --shadow-m:0 2px 6px rgba(22,25,44,.06),0 10px 28px rgba(22,25,44,.09);
  --shadow-l:0 8px 22px rgba(22,25,44,.14),0 24px 60px rgba(22,25,44,.16);
  --r:16px;
  --tel:#2f54c9; --tel-bg:#e8edfd; --mail:#7a3fc0; --mail-bg:#f1e9fb;
  --fax:#5a607a; --fax-bg:#eceef4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1018; --bg-grad:linear-gradient(180deg,#121522 0%,#0e1018 340px);
    --card:#181b2a; --card-2:#1e2233;
    --ink:#e8eaf3; --ink-2:#a3a9c0; --ink-3:#6a7089;
    --line:#272b3f; --line-2:#20243646;
    --primary:#8fa6ff; --primary-2:#7d97f5; --accent:#d9b45a;
    --ok:#43c97c; --ok-bg:#12351f; --ko:#ff7b81; --ko-bg:#3a171b;
    --chip-on:#e8eaf3;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 2px 8px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35);
    --shadow-l:0 12px 40px rgba(0,0,0,.55);
    --tel:#8fa6ff; --tel-bg:#1f2747; --mail:#c79bf2; --mail-bg:#32204b;
    --fax:#a3a9c0; --fax-bg:#232738;
  }
}
*{box-sizing:border-box; margin:0}
html{-webkit-text-size-adjust:100%}
body{
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Roboto,sans-serif;
  background:var(--bg); background-image:var(--bg-grad); background-repeat:no-repeat;
  color:var(--ink); padding-bottom:90px; min-height:100vh;
  font-feature-settings:"cv05","tnum";
}
button{font-family:inherit}
a{color:inherit}

/* ==================== en-tête ==================== */
header{
  position:sticky; top:0; z-index:20; padding:12px 16px 10px;
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:1060px; margin:0 auto}
.titrebar{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.logo{
  width:38px; height:38px; border-radius:11px; flex-shrink:0;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);
  display:grid; place-items:center; font-size:19px; color:#fff;
  box-shadow:var(--shadow-s); cursor:pointer;
}
.titrebar h1{font-size:17px; font-weight:750; letter-spacing:-.01em; flex:1; min-width:0; cursor:pointer}
.titrebar h1 small{display:block; font-size:12px; font-weight:450; color:var(--ink-3)}
#syncstate{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-3);
  padding:5px 10px; border-radius:20px; background:var(--card); border:1px solid var(--line)}
#syncstate .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
#syncstate.on .dot{background:var(--ok)}
#syncstate.err .dot{background:var(--ko)}
#syncstate.err{cursor:pointer}
#syncstate.work .dot{background:var(--accent); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.iconbtn{
  width:38px; height:38px; border-radius:11px; border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); font-size:16px; cursor:pointer;
  display:grid; place-items:center; transition:all .15s; flex-shrink:0;
}
.iconbtn:hover{color:var(--ink); box-shadow:var(--shadow-s); transform:translateY(-1px)}
.searchwrap{position:relative}
.searchwrap .lens{position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--ink-3); font-size:15px; pointer-events:none}
#q{
  width:100%; padding:13px 44px; font-size:16px; color:var(--ink);
  border:1.5px solid var(--line); border-radius:15px; background:var(--card);
  outline:none; box-shadow:var(--shadow-s); transition:all .15s;
}
#q::placeholder{color:var(--ink-3)}
#q:focus{border-color:var(--primary-2); box-shadow:0 0 0 4px color-mix(in srgb, var(--primary-2) 14%, transparent), var(--shadow-s)}
#clearq{position:absolute; right:8px; top:50%; transform:translateY(-50%);
  border:none; background:var(--line-2); color:var(--ink-2); cursor:pointer;
  width:30px; height:30px; border-radius:50%; font-size:13px; display:none}
.chips{display:flex; gap:7px; overflow-x:auto; padding:10px 2px 2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--ink-2);
  border-radius:20px; padding:5px 13px; font-size:13px; font-weight:550;
  cursor:pointer; white-space:nowrap; transition:all .15s;
}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--chip-on); color:var(--bg); border-color:var(--chip-on)}

main{max-width:1060px; margin:0 auto; padding:14px 16px}
#stats{color:var(--ink-3); font-size:13px; margin:2px 4px 12px; font-weight:500}

/* ==================== vue liste : grille de fiches ==================== */
.cathead{
  font-size:13px; font-weight:750; color:var(--ink-2); text-transform:uppercase;
  letter-spacing:.07em; margin:22px 4px 10px; display:flex; align-items:center; gap:8px;
}
.cathead:first-child{margin-top:4px}
.cathead .cnt{font-weight:550; color:var(--ink-3); letter-spacing:0; text-transform:none}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:10px}
.jcard{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; cursor:pointer; box-shadow:var(--shadow-s);
  transition:all .16s; display:flex; flex-direction:column; gap:6px; min-width:0;
}
.jcard:hover{box-shadow:var(--shadow-m); transform:translateY(-2px); border-color:color-mix(in srgb, var(--primary-2) 35%, var(--line))}
.jcard .top{display:flex; align-items:center; gap:8px}
.jcard .nom{font-weight:700; font-size:15px; letter-spacing:-.005em; flex:1; min-width:0}
.jcard .adr{font-size:12px; color:var(--ink-3);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.jcard .foot{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-3); margin-top:2px}
.jcard .snip{
  font-size:12px; color:var(--ink-2); background:var(--card-2); border-radius:8px;
  padding:6px 9px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.jcard .snip b{color:var(--primary-2); font-weight:650}
.badge{
  font-size:10.5px; font-weight:700; padding:3.5px 9px; border-radius:8px;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; flex-shrink:0;
}
.b-tj{color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.b-ca{color:#7a3fc0; background:var(--mail-bg)}
.b-cassation{color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent)}
.b-penitentiaire{color:#a05a1c; background:#f8ecdd}
.b-commissariat{color:#0f6f8a; background:#e0f2f8}
.b-cra{color:#0f8a68; background:#def4ec}
.b-prefecture,.b-douane,.b-etranger,.b-commerce,.b-autre{color:var(--ink-2); background:var(--line-2)}
@media (prefers-color-scheme: dark){
  .b-penitentiaire{background:#3a2a14} .b-commissariat{background:#12303a} .b-cra{background:#123329}
}
.more{
  display:block; width:100%; padding:13px; margin:14px 0 24px;
  border:1.5px dashed var(--line); background:none; color:var(--primary-2);
  border-radius:var(--r); cursor:pointer; font-size:14px; font-weight:600;
}
.more:hover{background:var(--card)}
.vide{text-align:center; color:var(--ink-3); padding:60px 10px}
.vide .big{font-size:40px; margin-bottom:10px}

/* ==================== vue fiche ==================== */
.fhead{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow-s); padding:16px 18px; margin-bottom:12px;
}
.fhead .row1{display:flex; align-items:center; gap:12px}
#btnback{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
  background:var(--card-2); color:var(--ink); font-size:16px; cursor:pointer; flex-shrink:0;
}
#btnback:hover{box-shadow:var(--shadow-s)}
.fhead h2{font-size:19px; font-weight:750; letter-spacing:-.01em; flex:1; min-width:0}
.fhead .adr{font-size:13px; color:var(--ink-2); margin:8px 0 0 48px}
.fhead .facts{display:flex; gap:6px; margin:10px 0 0 48px; flex-wrap:wrap}
.mini{
  border:none; background:none; color:var(--ink-3); cursor:pointer; font-size:12.5px;
  padding:5px 10px; border-radius:8px; font-weight:550;
}
.mini:hover{background:var(--line-2); color:var(--ink)}

.flayout{display:grid; grid-template-columns:230px 1fr; gap:14px; align-items:start}
.toc{
  position:sticky; top:130px; background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow-s); padding:8px; max-height:calc(100vh - 150px);
  overflow-y:auto;
}
.toc a{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px;
  font-size:13px; font-weight:550; color:var(--ink-2); text-decoration:none; cursor:pointer;
}
.toc a:hover{background:var(--card-2); color:var(--ink)}
.toc a .cnt{margin-left:auto; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.toc a.here{background:color-mix(in srgb, var(--primary-2) 10%, transparent); color:var(--primary-2)}
.tochead{
  font-size:10.5px; font-weight:750; color:var(--ink-3); text-transform:uppercase;
  letter-spacing:.09em; padding:10px 10px 3px; user-select:none;
}
.tochead:first-child{padding-top:4px}
@media (max-width:800px){
  .tochead{display:flex; align-items:center; padding:8px 4px; white-space:nowrap; flex-shrink:0}
}
@media (max-width:800px){
  .flayout{display:block}
  .toc{position:static; max-height:none; display:flex; overflow-x:auto; gap:4px;
    padding:6px; margin-bottom:12px; scrollbar-width:none}
  .toc::-webkit-scrollbar{display:none}
  .toc a{white-space:nowrap; flex-shrink:0}
  .toc a .cnt{margin-left:6px}
  .fhead .adr,.fhead .facts{margin-left:0}
}

.svcblock{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow-s); margin-bottom:14px; overflow:hidden; scroll-margin-top:140px;
}
.svcblock>h3{
  display:flex; align-items:center; gap:10px; padding:13px 16px;
  font-size:13.5px; font-weight:750; color:var(--primary); text-transform:uppercase;
  letter-spacing:.06em; background:var(--card-2); cursor:pointer; user-select:none;
}
.svcblock.open>h3{border-bottom:1px solid var(--line-2)}
.svcblock>h3 .caret{color:var(--ink-3); font-size:10px; transition:transform .2s}
.svcblock.open>h3 .caret{transform:rotate(90deg)}
.svcblock .svcinner{display:none}
.svcblock.open .svcinner{display:block}
.svcblock>h3 .cnt{font-size:11.5px; color:var(--ink-3); font-weight:600}
.svcblock>h3 .sp{flex:1}
.bureau{padding:4px 0}
.bureau>h4{
  display:flex; align-items:center; gap:8px;
  padding:10px 16px 4px; font-size:13.5px; font-weight:700; color:var(--ink);
}
.bureau>h4::before{content:''; width:4px; height:15px; border-radius:2px;
  background:linear-gradient(180deg,var(--primary-2),var(--primary)); flex-shrink:0}
.bureau>h4 .cnt{font-size:11px; color:var(--ink-3); font-weight:600}

/* entrée = un interlocuteur avec tous ses canaux regroupés */
.entry{
  display:grid; grid-template-columns:minmax(140px, 2fr) 3fr; gap:4px 16px;
  padding:10px 16px; border-top:1px solid var(--line-2); align-items:start;
}
.bureau .entry{padding-left:28px}
.entry:first-child{border-top:none}
.entry .elabel{font-size:13.5px; font-weight:600; color:var(--ink); padding-top:5px;
  overflow-wrap:break-word}
.entry .elabel .enote{display:block; font-size:12px; font-weight:450; color:var(--ink-3);
  font-style:italic; margin-top:3px}
.entry.nolabel{grid-template-columns:1fr}
.chans{display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-width:0}
.chan{
  display:inline-flex; align-items:center; gap:7px; padding:4px 9px;
  border-radius:11px; background:var(--card-2); border:1px solid var(--line-2);
  transition:background .12s; min-width:0;
}
.chan:hover{background:var(--line-2); border-color:var(--line)}
.chan.dead{opacity:.45}
.tico{width:24px; height:24px; border-radius:7px; display:grid; place-items:center;
  font-size:11.5px; flex-shrink:0}
.tico.tel{background:var(--tel-bg); color:var(--tel)}
.tico.email{background:var(--mail-bg); color:var(--mail)}
.tico.fax{background:var(--fax-bg); color:var(--fax)}
.chan a.v{
  font-weight:650; font-size:14px; text-decoration:none; color:var(--ink);
  font-variant-numeric:tabular-nums; letter-spacing:.01em; word-break:break-all; min-width:0;
}
.chan a.v:hover{color:var(--primary-2)}
.score{font-size:10.5px; font-weight:700; border-radius:7px; padding:2px 7px;
  white-space:nowrap; font-variant-numeric:tabular-nums; flex-shrink:0}
.score.good{color:var(--ok); background:var(--ok-bg)}
.score.bad{color:var(--ko); background:var(--ko-bg)}
.chan .acts{display:flex; align-items:center; gap:2px; margin-left:2px; flex-shrink:0}
.abtn{
  width:28px; height:28px; border-radius:8px; border:1px solid transparent;
  background:none; color:var(--ink-3); cursor:pointer; font-size:12.5px;
  display:grid; place-items:center; transition:all .12s;
}
.abtn:hover{background:var(--line-2); color:var(--ink)}
.abtn.rok:hover{background:var(--ok-bg); color:var(--ok)}
.abtn.rko:hover{background:var(--ko-bg); color:var(--ko)}
@media (hover:hover){
  .chan .acts .ghost{display:none}
  .chan:hover .acts .ghost{display:grid}
}
@media (max-width:640px){
  .entry{grid-template-columns:1fr; gap:2px; padding:9px 12px}
  .bureau .entry{padding-left:20px}
  .entry .elabel{padding-top:0}
}
.svcfoot{padding:8px 12px; border-top:1px solid var(--line-2)}

/* ==================== bouton flottant ==================== */
#fab{
  position:fixed; right:20px; bottom:20px; z-index:30;
  height:54px; padding:0 22px 0 18px; border-radius:27px; border:none;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 100%);
  color:#fff; font-size:15px; font-weight:650; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  box-shadow:var(--shadow-l); transition:transform .15s;
}
#fab:hover{transform:translateY(-2px) scale(1.02)}
#fab span{font-size:22px; font-weight:400; line-height:1}
@media (max-width:560px){ #fab{padding:0; width:54px; justify-content:center} #fab b{display:none} }

/* ==================== dialogues ==================== */
dialog{
  border:none; border-radius:20px; padding:0; max-width:500px; width:calc(100vw - 32px);
  background:var(--card); color:var(--ink); box-shadow:var(--shadow-l); max-height:88vh;
  margin:auto; overflow-y:auto; /* centrage (le reset global écrase celui du navigateur) */
}
dialog::backdrop{background:rgba(10,12,26,.5); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.dlg{padding:22px}
.dlg h2{font-size:17px; font-weight:750; margin-bottom:16px}
.dlg label{display:block; font-size:12px; font-weight:650; margin:12px 0 5px;
  color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em}
.dlg label .hint{text-transform:none; letter-spacing:0; font-weight:450}
.dlg input,.dlg select,.dlg textarea{
  width:100%; padding:10px 12px; font-size:15px; color:var(--ink);
  border:1.5px solid var(--line); border-radius:10px; background:var(--card-2);
  outline:none; font-family:inherit; transition:border-color .15s;
}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:var(--primary-2)}
.crow{display:flex; gap:6px; margin:6px 0; align-items:center}
.crow select{width:auto; flex-shrink:0; padding:10px 6px}
.crow input{flex:1; min-width:0}
.crow .delrow{flex-shrink:0}
.dlgbtns{display:flex; gap:8px; justify-content:flex-end; margin-top:20px}
.btn{
  padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600;
  cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink);
  transition:all .15s;
}
.btn:hover{box-shadow:var(--shadow-s)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; border:none}
.setrow{display:flex; align-items:center; gap:8px; margin:8px 0}
.setrow .btn{flex:1}
hr{border:none; border-top:1px solid var(--line); margin:16px 0}
.hint{font-size:12px; color:var(--ink-3); line-height:1.5}
#toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:12px;
  font-size:14px; font-weight:550; opacity:0; pointer-events:none;
  transition:all .25s; z-index:40; max-width:90vw; text-align:center; box-shadow:var(--shadow-l);
}
#toast.show{opacity:.97; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="titrebar">
    <div class="logo" onclick="goHome()">⚖️</div>
    <h1 onclick="goHome()">Annuaire Justice<small id="count"></small></h1>
    <div id="syncstate" title="Synchronisation"><span class="dot"></span><span id="synctxt">local</span></div>
    <button class="iconbtn" id="btnsettings" title="Réglages">⚙</button>
  </div>
  <div class="searchwrap">
    <span class="lens">🔍</span>
    <input id="q" type="search" placeholder="Ville, juridiction, service, numéro, mail…"
      autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="clearq" title="Effacer">✕</button>
  </div>
  <div class="chips" id="chips"></div>
</div></header>

<main>
  <div id="stats"></div>
  <div id="view"></div>
</main>

<button id="fab" title="Ajouter un contact"><span>＋</span><b>Ajouter</b></button>
<div id="toast"></div>

<dialog id="dlgAdd"><form class="dlg" method="dialog" id="formAdd">
  <h2 id="addTitle">Ajouter un contact</h2>
  <label>Juridiction</label>
  <input id="fJur" list="listJur" placeholder="TJ Melun, CA Paris… (créée si inconnue)" required>
  <datalist id="listJur"></datalist>
  <label>Catégorie <span class="hint">(si nouvelle juridiction)</span></label>
  <select id="fCat">
    <option value="tj">Tribunal judiciaire</option>
    <option value="ca">Cour d'appel</option>
    <option value="cassation">Cour de cassation</option>
    <option value="penitentiaire">Établissement pénitentiaire</option>
    <option value="commissariat">Commissariat</option>
    <option value="cra">CRA</option>
    <option value="prefecture">Préfecture</option>
    <option value="douane">Douanes</option>
    <option value="autre">Autre</option>
  </select>
  <label>Service</label>
  <input id="fSvc" list="listSvc" placeholder="Greffe correctionnel, Parquet, JAF…">
  <datalist id="listSvc"></datalist>
  <label>Bureau <span class="hint">(facultatif — ex. Bureau d'ordre pénal)</span></label>
  <input id="fGrp" list="listGrp">
  <datalist id="listGrp"></datalist>
  <label>Libellé <span class="hint">(l'intitulé — ex. Greffe de la 3e chambre)</span></label>
  <input id="fLib" placeholder="Greffe de la 3e chambre…">
  <label>Numéros et adresses mail <span class="hint">(autant que nécessaire)</span></label>
  <div id="fRows"></div>
  <button type="button" class="mini" id="btnAddRow" style="margin-top:2px">＋ Ajouter un numéro ou un mail</button>
  <label>Note <span class="hint">(facultatif)</span></label>
  <textarea id="fNote" rows="2" placeholder="Précisions, horaires, interlocuteur…"></textarea>
  <div class="dlgbtns">
    <button class="btn" value="cancel" formnovalidate>Annuler</button>
    <button class="btn primary" value="ok" id="addOk">Ajouter</button>
  </div>
</form></dialog>

<dialog id="dlgSettings"><div class="dlg">
  <h2>Réglages</h2>
  <div class="setrow"><button class="btn" id="btnExport">⬇️ Exporter les données (JSON)</button></div>
  <div class="setrow"><button class="btn" id="btnImport">⬆️ Importer un fichier JSON</button>
    <input type="file" id="fileImport" accept=".json" hidden></div>
  <hr>
  <div id="driveBox">
    <div class="setrow"><button class="btn primary" id="btnDrive">☁️ Connecter Google Drive</button></div>
    <div class="setrow" style="display:none" id="rowDriveOff"><button class="btn" id="btnDriveOff">Déconnecter Google Drive</button></div>
    <p class="hint" id="driveHint"></p>
  </div>
  <hr>
  <p class="hint" id="metaInfo"></p>
  <div class="dlgbtns"><button class="btn primary" id="btnCloseSettings">Fermer</button></div>
</div></dialog>

<script>
'use strict';
/* ============================================================
   CONFIG — synchronisation Google Drive
   ============================================================ */
const CLIENT_ID = '1002386733501-oeq2g899a2dlgcttg0qem8a7ugvsh847.apps.googleusercontent.com';
const DRIVE_FILENAME = 'annuaire-justice-data.json';
const LS_KEY = 'annuaireJustice.data';
const LS_DRIVE = 'annuaireJustice.driveOn';
const LS_FILEID = 'annuaireJustice.driveFileId';

/* ============================ état ============================ */
let DATA = null;
let currentCat = '';
let shownCards = 60;
let ficheId = null;          // juridiction affichée en fiche (null = liste)
let ficheDom = '';           // filtre de domaine dans la fiche ('' = tout)
const openState = {};        // id -> ouvert/fermé (services, volets)
const $ = s => document.querySelector(s);

const CATS = {
  tj:'Tribunaux judiciaires', ca:"Cours d'appel", cassation:'Cour de cassation',
  penitentiaire:'Établissements pénitentiaires', commissariat:'Commissariats', cra:'CRA',
  prefecture:'Préfectures', douane:'Douanes', etranger:'Étranger',
  commerce:'Tribunaux de commerce', autre:'Autres'
};
const CAT_LABEL = {
  tj:'TJ', ca:'CA', cassation:'Cass.', penitentiaire:'Prison',
  commissariat:'Police', cra:'CRA', prefecture:'Préf.', douane:'Douane',
  etranger:'Étranger', commerce:'T.Com', autre:'Autre'
};

/* ============================ utilitaires ============================ */
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const digits = s => (s||'').replace(/\D/g,'');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2600);
}
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'2-digit'}) : '';

/* ============================ persistance ============================ */
function save(){
  DATA.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }
  catch(e){ toast('⚠️ Stockage local plein : '+e.message); }
  Drive.schedulePush();
}
async function load(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ try{ DATA = JSON.parse(raw); }catch(e){} }
  if(!DATA){
    try{
      const r = await fetch('annuaire.json', {cache:'no-cache'});
      if(r.ok) DATA = await r.json();
    }catch(e){}
    if(!DATA) DATA = {version:1, juridictions:[]};
    DATA.tombstones = DATA.tombstones||{};
    DATA.updatedAt = Date.now();
    try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){}
  }
  DATA.tombstones = DATA.tombstones||{};
  buildIndex();
}

/* ============================ index de recherche ============================ */
function buildIndex(){
  for(const j of DATA.juridictions){
    j._txt = norm(j.nom+' '+(CATS[j.categorie]||'')+' '+j.categorie+' '+(j.adresse||''));
    for(const s of j.services){
      s._txt = norm(s.nom);
      for(const c of s.contacts){
        c._txt = norm((c.libelle||'')+' '+(c.groupe||'')+' '+c.valeur+' '+(c.note||''));
        c._dig = c.type==='email' ? '' : digits(c.valeur);
      }
    }
  }
}

/* ============================ notation ============================ */
const NOW = () => Date.now();
const J90 = 90*24*3600*1000;
function score(c){
  let s = (c.ok||0)*3 - (c.ko||0)*2;
  if(c.lastOk && NOW()-c.lastOk < J90) s += 100;
  else if(c.lastOk) s += 40;
  return s;
}
const isDead = c => (c.ko||0)>=3 && !(c.ok>0);

/* ============================ regroupement en entrées ============================
   Une « entrée » = un interlocuteur (libellé) avec tous ses canaux
   (téléphones, mails, fax) regroupés. Les entrées sont elles-mêmes
   rangées par bureau (champ groupe). */
function structureService(contacts){
  const bureaux = new Map();   // clé normalisée -> {nom, entries:Map}
  const rootKey = '';
  const gkeys = new Set(contacts.filter(c=>c.groupe).map(c=>norm(c.groupe)));
  for(const c of contacts){
    let gk = c.groupe ? norm(c.groupe) : '';
    let gnom = c.groupe || '';
    // un libellé identique au nom d'un bureau rejoint ce bureau
    if(!gk && gkeys.has(norm(c.libelle||''))){ gk = norm(c.libelle); gnom = c.libelle; }
    if(!bureaux.has(gk)) bureaux.set(gk, {nom:gnom, entries:new Map()});
    const b = bureaux.get(gk);
    let lib = c.libelle||'';
    if(gk && norm(lib)===gk) lib = '';         // pas de répétition bureau/libellé
    const ek = norm(lib);
    if(!b.entries.has(ek)) b.entries.set(ek, {lib, chans:[], note:''});
    const e = b.entries.get(ek);
    e.chans.push(c);
    if(c.note && !e.note) e.note = c.note;
  }
  // tri des canaux d'une entrée : tél d'abord (les mieux notés en tête), puis mail, fax
  const rank = {tel:0, email:1, fax:2};
  for(const b of bureaux.values())
    for(const e of b.entries.values())
      e.chans.sort((a,c)=> (rank[a.type]-rank[c.type]) || (score(c)-score(a)) );
  // racine d'abord, puis bureaux dans l'ordre du document
  const out = [];
  if(bureaux.has(rootKey)) out.push(bureaux.get(rootKey));
  for(const [k,b] of bureaux) if(k!==rootKey) out.push(b);
  return out;
}

/* ============================ recherche ============================ */
function search(){
  const tokens = norm($('#q').value.trim()).split(/\s+/).filter(Boolean);
  const results = [];
  for(const j of DATA.juridictions){
    if(currentCat && j.categorie!==currentCat) continue;
    if(!tokens.length){ results.push({j, hits:null, nameHit:0}); continue; }
    const rest = tokens.filter(t=>!j._txt.includes(t));
    const nameHit = tokens.length - rest.length;
    if(!rest.length){ results.push({j, hits:null, nameHit}); continue; }
    const hits = [];
    for(const s of j.services){
      const rest2 = rest.filter(t=>!s._txt.includes(t));
      const cts = s.contacts.filter(c =>
        rest2.every(t => c._txt.includes(t) ||
          (c._dig && digits(t).length>=4 && c._dig.includes(digits(t)))));
      if(cts.length) hits.push({s, cts});
    }
    if(hits.length) results.push({j, hits, nameHit});
  }
  results.sort((a,b)=> (b.nameHit-a.nameHit) ||
    (b.j.services.reduce((m,s)=>m+s.contacts.length,0) - a.j.services.reduce((m,s)=>m+s.contacts.length,0)));
  return {results, tokens};
}

/* ============================ navigation ============================ */
function goHome(){ ficheId = null; if(location.hash) history.pushState(null,'',location.pathname+location.search); render(); window.scrollTo(0,0); }
window.goHome = goHome;
window.openFiche = id => {
  if(id!==ficheId) ficheDom = '';
  ficheId = id;
  history.pushState(null,'','#f/'+id);
  render(); window.scrollTo(0,0);
};
window.setFicheDom = d => { ficheDom = d; render(); };
window.addEventListener('popstate', ()=>{
  const m = location.hash.match(/^#f\/(.+)$/);
  ficheId = m ? m[1] : null;
  render();
});

/* ============================ rendu ============================ */
function render(){
  const total = DATA.juridictions.length;
  const nc = DATA.juridictions.reduce((n,j)=>n+j.services.reduce((m,s)=>m+s.contacts.length,0),0);
  $('#count').textContent = `${total} juridictions · ${nc.toLocaleString('fr-FR')} contacts`;
  $('#clearq').style.display = $('#q').value ? 'block':'none';
  if(ficheId){
    const j = DATA.juridictions.find(x=>x.id===ficheId);
    if(j){ renderFiche(j); return; }
    ficheId = null;
  }
  renderList();
}

/* ---------- vue liste ---------- */
function renderList(){
  const {results, tokens} = search();
  const V = $('#view');
  $('#stats').textContent = tokens.length||currentCat ?
    `${results.length} juridiction${results.length>1?'s':''} — cliquez sur une fiche pour l'ouvrir` :
    `Tapez une recherche ou parcourez les fiches par catégorie`;
  if(!results.length){
    V.innerHTML = `<div class="vide"><div class="big">🔍</div>Aucun résultat.<br><br>
      <button class="btn primary" onclick="openAdd()">＋ Ajouter ce contact</button></div>`;
    return;
  }
  const slice = results.slice(0, shownCards);
  let html = '';
  if(!tokens.length && !currentCat){
    // accueil : aperçu structuré de toutes les catégories
    const order = ['tj','ca','cassation','penitentiaire','commissariat','cra','prefecture','douane','etranger','commerce','autre'];
    const bycat = {};
    for(const r of results) (bycat[r.j.categorie] = bycat[r.j.categorie]||[]).push(r);
    const CAP = 9;
    for(const cat of order){
      const list = bycat[cat]; if(!list) continue;
      html += `<div class="cathead">${CATS[cat]||cat} <span class="cnt">· ${list.length}</span>`;
      if(list.length>CAP) html += `<button class="mini" onclick="setCat('${cat}')">tout afficher →</button>`;
      html += `</div><div class="grid">`;
      for(const r of list.slice(0,CAP)) html += cardJur(r, null);
      html += '</div>';
    }
    $('#view').innerHTML = html;
    return;
  } else {
    html = '<div class="grid">' + slice.map(r=>cardJur(r, tokens)).join('') + '</div>';
  }
  if(results.length > shownCards)
    html += `<button class="more" onclick="shownCards+=80;render()">Afficher ${results.length-shownCards} fiches de plus</button>`;
  V.innerHTML = html;
}

function cardJur({j, hits}, tokens){
  const nc = j.services.reduce((m,s)=>m+s.contacts.length,0);
  let snips = '';
  if(hits){
    for(const h of hits.slice(0,3)){
      const c = h.cts[0];
      const what = c.libelle || c.groupe || h.s.nom;
      snips += `<div class="snip"><b>${esc(h.s.nom)}</b> — ${esc(what)} · ${esc(c.valeur)}${h.cts.length>1?` <span style="color:var(--ink-3)">+${h.cts.length-1}</span>`:''}</div>`;
    }
  }
  return `<div class="jcard" onclick="openFiche('${j.id}')">
    <div class="top">
      <span class="nom">${esc(j.nom)}</span>
      <span class="badge b-${j.categorie}">${CAT_LABEL[j.categorie]||j.categorie}</span>
    </div>
    ${j.adresse?`<div class="adr">📍 ${esc(j.adresse)}</div>`:''}
    ${snips}
    <div class="foot"><span>${j.services.length} service${j.services.length>1?'s':''}</span><span>·</span><span>${nc} contacts</span></div>
  </div>`;
}

/* ---------- vue fiche ---------- */
const DOMAIN_LABEL = {general:'Général', civil:'Civil', penal:'Pénal',
  famille:'JAF', autres:'Autres'};

function isOpen(id, dflt){ return openState[id]!==undefined ? openState[id] : dflt; }

function svcMatches(j, s, tokens){
  if(!tokens.length) return false;
  const rest = tokens.filter(t=>!j._txt.includes(t));
  if(!rest.length) return false;
  const rest2 = rest.filter(t=>!s._txt.includes(t));
  if(!rest2.length) return true;
  return s.contacts.some(c => rest2.every(t => c._txt.includes(t) ||
    (c._dig && digits(t).length>=4 && c._dig.includes(digits(t)))));
}

function renderFiche(j){
  const tokens = norm($('#q').value.trim()).split(/\s+/).filter(Boolean);
  const nc = j.services.reduce((m,s)=>m+s.contacts.length,0);
  $('#stats').textContent = '';
  // boutons de filtre par domaine (Tout / Général / Civil / Pénal / JAF / Autres)
  const domCounts = {};
  for(const s of j.services){
    const d = s.domaine||'autres';
    domCounts[d] = (domCounts[d]||0) + s.contacts.length;
  }
  const hasDomains = j.services.some(s=>s.domaine);
  let fchips = '';
  if(hasDomains){
    fchips = `<div class="chips" style="padding:2px 2px 10px">`+
      `<button class="chip ${!ficheDom?'on':''}" onclick="setFicheDom('')">Tout · ${nc}</button>`;
    for(const d of ['general','civil','penal','famille','autres']){
      if(!domCounts[d]) continue;
      fchips += `<button class="chip ${ficheDom===d?'on':''}" onclick="setFicheDom('${d}')">${DOMAIN_LABEL[d]} · ${domCounts[d]}</button>`;
    }
    fchips += '</div>';
  }
  let toc = '', blocks = '';
  for(const s of j.services){
    if(ficheDom && (s.domaine||'autres')!==ficheDom) continue;
    toc += `<a onclick="gotoSvc('${s.id}')">${esc(s.nom)}<span class="cnt">${s.contacts.length}</span></a>`;
    blocks += renderSvcBlock(j, s, svcMatches(j, s, tokens));
  }
  if(!blocks) blocks = `<div class="vide">Aucun service dans cette catégorie.</div>`;
  $('#view').innerHTML = `
    <div class="fhead">
      <div class="row1">
        <button id="btnback" onclick="goHome()" title="Retour">←</button>
        <h2>${esc(j.nom)}</h2>
        <span class="badge b-${j.categorie}">${CAT_LABEL[j.categorie]||j.categorie}</span>
      </div>
      ${j.adresse?`<div class="adr">📍 ${esc(j.adresse)} <button class="mini" onclick="copyVal('${esc(j.adresse)}')">⧉ copier</button></div>`:''}
      <div class="facts">
        <button class="mini" onclick="openAdd('${j.id}')">＋ Ajouter un contact</button>
        <button class="mini" onclick="delJur('${j.id}')">🗑 Supprimer la juridiction</button>
        <span class="mini" style="cursor:default">${j.services.length} services · ${nc} contacts</span>
      </div>
    </div>
    ${fchips}
    <div class="flayout">
      <nav class="toc">${toc}</nav>
      <div>${blocks}</div>
    </div>`;
}

function renderSvcBlock(j, s, matchOpen){
  const open = isOpen(s.id, !!matchOpen);
  let inner = '';
  if(open){
    const bureaux = structureService(s.contacts);
    for(const b of bureaux){
      let rows = '';
      for(const e of b.entries.values()) rows += renderEntry(e);
      if(b.nom){
        const n = [...b.entries.values()].reduce((m,e)=>m+e.chans.length,0);
        inner += `<div class="bureau"><h4>${esc(b.nom)} <span class="cnt">${n}</span></h4>${rows}</div>`;
      } else inner += rows;
    }
    inner = `<div class="svcinner">${inner}</div>`;
  }
  return `<section class="svcblock ${open?'open':''}" id="svc-${s.id}">
    <h3 onclick="tgl('${s.id}', ${open})">
      <span class="caret">▶</span>
      ${esc(s.nom)} <span class="cnt">${s.contacts.length}</span><span class="sp"></span>
      <button class="mini" onclick="event.stopPropagation();openAdd('${j.id}','${s.id}')">＋</button>
      <button class="mini" onclick="event.stopPropagation();delService('${j.id}','${s.id}')">🗑</button>
    </h3>
    ${inner}
  </section>`;
}
window.gotoSvc = sid => {
  openState[sid] = true;
  render();
  document.getElementById('svc-'+sid)?.scrollIntoView({behavior:'smooth', block:'start'});
};

function renderEntry(e){
  let chans = '';
  for(const c of e.chans) chans += renderChan(c);
  const label = e.lib ? `<div class="elabel">${esc(e.lib)}${e.note?`<span class="enote">${esc(e.note)}</span>`:''}</div>` : (e.note?`<div class="elabel"><span class="enote">${esc(e.note)}</span></div>`:'');
  return `<div class="entry ${label?'':'nolabel'}">${label}<div class="chans">${chans}</div></div>`;
}

function renderChan(c){
  const href = c.type==='email' ? 'mailto:'+c.valeur :
    'tel:'+(digits(c.valeur).length===10 ? '+33'+digits(c.valeur).slice(1) : digits(c.valeur));
  const ic = c.type==='email' ? '✉️' : c.type==='fax' ? '📠' : '📞';
  let badge = '';
  if(c.ok>0) badge = `<span class="score good" title="${c.ok} appel(s) réussi(s)">✓ ${c.ok}${c.lastOk?' · '+fmtDate(c.lastOk):''}</span>`;
  else if(c.ko>0) badge = `<span class="score bad" title="${c.ko} échec(s)">✗ ${c.ko}</span>`;
  return `<div class="chan ${isDead(c)?'dead':''}" id="ct-${c.id}">
    <span class="tico ${c.type}">${ic}</span>
    <a class="v" href="${href}" ${c.type==='fax'?'onclick="return false"':''}>${esc(c.valeur)}</a>
    ${badge}
    <div class="acts">
      <button class="abtn ghost" title="Copier" onclick="copyVal('${esc(c.valeur)}')">⧉</button>
      <button class="abtn ghost" title="Modifier" onclick="openEdit('${c.id}')">✎</button>
      <button class="abtn ghost" title="Supprimer" onclick="delContact('${c.id}')">🗑</button>
      <button class="abtn rok" title="Ça a répondu" onclick="rate('${c.id}',1)">✓</button>
      <button class="abtn rko" title="Ne répond pas" onclick="rate('${c.id}',0)">✗</button>
    </div>
  </div>`;
}

function renderChips(){
  const counts = {};
  for(const j of DATA.juridictions) counts[j.categorie]=(counts[j.categorie]||0)+1;
  let html = `<button class="chip ${!currentCat?'on':''}" onclick="setCat('')">Tout</button>`;
  for(const [k,v] of Object.entries(CATS)){
    if(!counts[k]) continue;
    html += `<button class="chip ${currentCat===k?'on':''}" onclick="setCat('${k}')">${v} · ${counts[k]}</button>`;
  }
  $('#chips').innerHTML = html;
}

/* ============================ interactions ============================ */
window.setCat = c => { currentCat=c; shownCards=60; ficheId=null; renderChips(); render(); };
window.tgl = (id, cur) => { openState[id] = !cur; render(); };
window.copyVal = v => { navigator.clipboard?.writeText(v).then(()=>toast('Copié : '+v)); };

function findContact(id){
  for(const j of DATA.juridictions) for(const s of j.services)
    for(const c of s.contacts) if(c.id===id) return {j,s,c};
  return null;
}
window.rate = (id, ok) => {
  const f = findContact(id); if(!f) return;
  if(ok){ f.c.ok=(f.c.ok||0)+1; f.c.lastOk=NOW(); toast('✓ Noté : ce numéro répond'); }
  else { f.c.ko=(f.c.ko||0)+1; toast('✗ Échec noté'); }
  f.c.lastTry=NOW(); f.c.u=NOW();
  save(); render();
};
window.delContact = id => {
  const f = findContact(id); if(!f) return;
  if(!confirm(`Supprimer ${f.c.valeur} (${f.c.libelle||f.s.nom}) ?`)) return;
  f.s.contacts = f.s.contacts.filter(c=>c.id!==id);
  DATA.tombstones[id]=NOW();
  save(); render(); toast('Contact supprimé');
};
window.delService = (jid,sid) => {
  const j = DATA.juridictions.find(x=>x.id===jid); if(!j) return;
  const s = j.services.find(x=>x.id===sid); if(!s) return;
  if(!confirm(`Supprimer le service « ${s.nom} » et ses ${s.contacts.length} contacts ?`)) return;
  for(const c of s.contacts) DATA.tombstones[c.id]=NOW();
  DATA.tombstones[sid]=NOW();
  j.services = j.services.filter(x=>x.id!==sid);
  save(); render(); toast('Service supprimé');
};
window.delJur = id => {
  const j = DATA.juridictions.find(x=>x.id===id); if(!j) return;
  const nc = j.services.reduce((m,s)=>m+s.contacts.length,0);
  if(!confirm(`Supprimer « ${j.nom} » et ses ${nc} contacts ?`)) return;
  for(const s of j.services){ for(const c of s.contacts) DATA.tombstones[c.id]=NOW(); DATA.tombstones[s.id]=NOW(); }
  DATA.tombstones[id]=NOW();
  DATA.juridictions = DATA.juridictions.filter(x=>x.id!==id);
  if(ficheId===id) ficheId=null;
  save(); renderChips(); render(); toast('Juridiction supprimée');
};

/* ============================ ajout / édition ============================ */
let addCtx = {};
function fillLists(){
  $('#listJur').innerHTML = DATA.juridictions.map(j=>`<option value="${esc(j.nom)}">`).join('');
  refreshSvcList();
}
function refreshSvcList(){
  const j = DATA.juridictions.find(x=>norm(x.nom)===norm($('#fJur').value.trim()));
  $('#listSvc').innerHTML = j ? j.services.map(s=>`<option value="${esc(s.nom)}">`).join('') : '';
  const s = j && j.services.find(x=>norm(x.nom)===norm($('#fSvc').value.trim()));
  const grps = s ? [...new Set(s.contacts.map(c=>c.groupe).filter(Boolean))] : [];
  $('#listGrp').innerHTML = grps.map(g=>`<option value="${esc(g)}">`).join('');
}
/* lignes dynamiques numéro/mail du formulaire */
function makeRow(type, val){
  const div = document.createElement('div');
  div.className = 'crow';
  div.innerHTML = `<select>
      <option value="tel">📞</option>
      <option value="email">✉️</option>
      <option value="fax">📠</option>
    </select>
    <input placeholder="01 23 45 67 89 ou greffe@justice.fr" autocomplete="off">
    <button type="button" class="mini delrow" title="Retirer">✕</button>`;
  div.querySelector('select').value = type||'tel';
  div.querySelector('input').value = val||'';
  div.querySelector('input').addEventListener('input', e=>{
    const v = e.target.value, sel = div.querySelector('select');
    if(v.includes('@')) sel.value = 'email';
    else if(sel.value==='email' && digits(v).length>=6) sel.value = 'tel';
  });
  div.querySelector('.delrow').addEventListener('click', ()=>{
    div.remove();
    if(!$('#fRows').children.length) $('#fRows').appendChild(makeRow());
  });
  return div;
}
function resetRows(rows){
  const box = $('#fRows'); box.innerHTML = '';
  for(const r of (rows && rows.length ? rows : [{}]))
    box.appendChild(makeRow(r.type, r.val));
}
function collectRows(){
  const out = [];
  for(const div of $('#fRows').children){
    let val = div.querySelector('input').value.trim();
    if(!val) continue;
    let type = div.querySelector('select').value;
    if(val.includes('@')) type = 'email';
    if(type!=='email' && digits(val).length===10)
      val = digits(val).replace(/(\d\d)(?=\d)/g,'$1 ').trim();
    out.push({type, val});
  }
  return out;
}
$('#btnAddRow').addEventListener('click', ()=>{
  const r = makeRow();
  $('#fRows').appendChild(r);
  r.querySelector('input').focus();
});

window.openAdd = (jid, sid) => {
  addCtx = {edit:null};
  $('#addTitle').textContent = 'Ajouter une entrée';
  $('#addOk').textContent = 'Ajouter';
  fillLists();
  const j = (jid && DATA.juridictions.find(x=>x.id===jid)) ||
            (ficheId && DATA.juridictions.find(x=>x.id===ficheId));
  $('#fJur').value = j ? j.nom : '';
  const s = j && sid && j.services.find(x=>x.id===sid);
  $('#fSvc').value = s ? s.nom : '';
  $('#fGrp').value=''; $('#fLib').value=''; $('#fNote').value='';
  resetRows();
  const q = $('#q').value.trim();
  if(!j && q && !/\d|@/.test(q)) $('#fJur').value = q;
  refreshSvcList();
  $('#dlgAdd').showModal();
};
window.openEdit = id => {
  const f = findContact(id); if(!f) return;
  addCtx = {edit:id};
  $('#addTitle').textContent = 'Modifier le contact';
  $('#addOk').textContent = 'Enregistrer';
  fillLists();
  $('#fJur').value = f.j.nom; $('#fSvc').value = f.s.nom;
  $('#fGrp').value = f.c.groupe||''; $('#fLib').value = f.c.libelle||'';
  $('#fNote').value = f.c.note||'';
  resetRows([{type:f.c.type, val:f.c.valeur}]);
  refreshSvcList();
  $('#dlgAdd').showModal();
};
$('#fJur').addEventListener('input', refreshSvcList);
$('#fSvc').addEventListener('input', refreshSvcList);
$('#formAdd').addEventListener('submit', e=>{
  if(e.submitter && e.submitter.value==='cancel') return;
  const rows = collectRows();
  if(!rows.length){
    e.preventDefault();
    alert('Renseignez au moins un numéro ou une adresse mail.');
    return;
  }
  const nomJ = $('#fJur').value.trim();
  const nomS = $('#fSvc').value.trim()||'Général';
  let j = DATA.juridictions.find(x=>norm(x.nom)===norm(nomJ));
  if(!j){
    j = {id:uid('j'), nom:nomJ, categorie:$('#fCat').value, adresse:'', services:[], u:NOW()};
    DATA.juridictions.push(j);
    DATA.juridictions.sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  }
  let s = j.services.find(x=>norm(x.nom)===norm(nomS));
  if(!s){ s = {id:uid('s'), nom:nomS, contacts:[], u:NOW()}; j.services.push(s); }
  const libelle = $('#fLib').value.trim();
  const groupe = $('#fGrp').value.trim();
  const note = $('#fNote').value.trim();
  if(addCtx.edit){
    const f = findContact(addCtx.edit);
    if(f){
      const first = rows.shift();
      if(f.s!==s){ f.s.contacts = f.s.contacts.filter(c=>c.id!==addCtx.edit); s.contacts.push(f.c); }
      Object.assign(f.c, {type:first.type, valeur:first.val, libelle, groupe, note, u:NOW()});
    }
    // lignes supplémentaires ajoutées pendant l'édition → nouveaux contacts de la même entrée
    for(const r of rows)
      s.contacts.push({id:uid('c'), type:r.type, valeur:r.val, libelle, groupe,
        note:'', ok:0, ko:0, lastOk:null, lastTry:null, u:NOW()});
    toast('Contact modifié');
  } else {
    rows.forEach((r, i)=>{
      s.contacts.push({id:uid('c'), type:r.type, valeur:r.val, libelle, groupe,
        note: i===0 ? note : '', ok:0, ko:0, lastOk:null, lastTry:null, u:NOW()});
    });
    toast(rows.length>1 ? rows.length+' contacts ajoutés à '+j.nom : 'Contact ajouté à '+j.nom);
    ficheId = j.id;
    history.replaceState(null,'','#f/'+j.id);
    openState[s.id] = true;
  }
  buildIndex(); save(); renderChips(); render();
});
$('#fab').addEventListener('click', ()=>openAdd());

$('#fileImport').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!Array.isArray(d.juridictions)) throw new Error('format invalide');
    if(!confirm(`Remplacer les données actuelles par « ${f.name} » (${d.juridictions.length} juridictions) ?`)) return;
    DATA = d; DATA.tombstones = DATA.tombstones||{};
    buildIndex(); save(); renderChips(); render();
    toast('Import réussi'); $('#dlgSettings').close();
  }catch(err){ alert('Import impossible : '+err.message); }

/* ============================================================
   SYNCHRONISATION GOOGLE DRIVE (scope drive.file)
   ============================================================ */
const Drive = (() => {
  const LS_TOKEN = 'annuaireJustice.tok';
  const LS_HINT = 'annuaireJustice.hint';
  let token=null, tokenClient=null, fileId=localStorage.getItem(LS_FILEID)||null;
  try{ token = JSON.parse(localStorage.getItem(LS_TOKEN)||'null'); }catch(e){}
  let pushTimer=null, busy=false, lastRemoteRev=null;
  const enabled = () => !!CLIENT_ID;
  const on = () => enabled() && localStorage.getItem(LS_DRIVE)==='1';

  function setState(cls, txt){
    $('#syncstate').className = cls; $('#synctxt').textContent = txt;
  }
  function refreshSettingsUI(){
    if(!enabled()){
      $('#btnDrive').style.display='none'; $('#rowDriveOff').style.display='none';
      $('#driveHint').textContent = 'Synchronisation Google Drive non configurée.';
      return;
    }
    $('#btnDrive').style.display = on()?'none':'flex';
    $('#rowDriveOff').style.display = on()?'flex':'none';
    $('#driveHint').textContent = on() ?
      'Connecté : le fichier « '+DRIVE_FILENAME+' » de votre Drive est synchronisé automatiquement entre vos appareils.' :
      'Vos données seront stockées dans un fichier de votre Google Drive et synchronisées entre tous vos appareils.';
  }
  async function saveHint(t){
    // mémorise l'adresse du compte pour les reconnexions silencieuses
    if(localStorage.getItem(LS_HINT)) return;
    try{
      const r = await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:H(t)});
      if(r.ok){
        const d = await r.json();
        if(d.user?.emailAddress) localStorage.setItem(LS_HINT, d.user.emailAddress);
      }
    }catch(e){}
  }
  async function ensureToken(interactive){
    if(!enabled()) return null;
    // jeton persistant : un rafraîchissement de page ne redemande rien
    if(token && token.exp > Date.now()+60000) return token.v;
    if(!window.google?.accounts?.oauth2){ setState('err','lib Google absente'); return null; }
    if(!tokenClient){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID, scope:'https://www.googleapis.com/auth/drive.file',
        callback:()=>{}, error_callback:()=>{}});
    }
    return new Promise(resolve=>{
      tokenClient.callback = resp=>{
        if(resp.access_token){
          token = {v:resp.access_token, exp:Date.now()+(resp.expires_in-60)*1000};
          try{ localStorage.setItem(LS_TOKEN, JSON.stringify(token)); }catch(e){}
          saveHint(token.v);
          resolve(token.v);
        } else resolve(null);
      };
      tokenClient.error_callback = ()=>resolve(null);
      // prompt:'' = interaction minimale : le consentement ne réapparaît que
      // si Google l'exige ; avec le compte mémorisé en indice, la reprise de
      // session est silencieuse
      const hint = localStorage.getItem(LS_HINT)||undefined;
      try{ tokenClient.requestAccessToken({prompt:'', hint}); }
      catch(e){ resolve(null); }
    });
  }
  const H = t => ({'Authorization':'Bearer '+t});
  const exportJson = () => JSON.stringify(DATA,(k,v)=>k.startsWith('_')?undefined:v);

  async function findOrCreate(t){
    if(fileId) return fileId;
    let r = await fetch('https://www.googleapis.com/drive/v3/files?q='+
      encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`)+'&fields=files(id)',{headers:H(t)});
    if(r.ok){ const d = await r.json(); if(d.files?.length) fileId = d.files[0].id; }
    if(!fileId){
      r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
        method:'POST', headers:{...H(t),'Content-Type':'multipart/related; boundary=BND'},
        body:`--BND\r\nContent-Type: application/json\r\n\r\n`+
          JSON.stringify({name:DRIVE_FILENAME, mimeType:'application/json'})+
          `\r\n--BND\r\nContent-Type: application/json\r\n\r\n`+exportJson()+`\r\n--BND--`});
      if(r.ok) fileId = (await r.json()).id;
    }
    if(fileId) localStorage.setItem(LS_FILEID, fileId);
    return fileId;
  }
  async function meta(t){
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=version,modifiedTime`,{headers:H(t)});
    return r.ok ? r.json() : null;
  }
  function mergeData(remote){
    if(!remote || !Array.isArray(remote.juridictions)) return false;
    // base régénérée (dataset différent) : on adopte la plus récente au lieu
    // de fusionner, sinon les identifiants différents créeraient des doublons
    if((remote.dataset||'') !== (DATA.dataset||'')){
      if((remote.updatedAt||0) > (DATA.updatedAt||0)){
        DATA.juridictions = remote.juridictions;
        DATA.tombstones = remote.tombstones||{};
        DATA.dataset = remote.dataset;
        DATA.updatedAt = remote.updatedAt;
        toast('Nouvelle version de la base adoptée');
      }
      return true; // sinon : notre base est plus récente, le push l'imposera
    }
    const tomb = {...(remote.tombstones||{}), ...DATA.tombstones};
    const byId = arr => Object.fromEntries(arr.map(x=>[x.id,x]));
    const newer = (a,b) => (a.u||0)>=(b.u||0) ? a : b;
    const jl = byId(DATA.juridictions);
    for(const rj of remote.juridictions){
      if(!jl[rj.id]){ jl[rj.id]=rj; continue; }
      const lj = jl[rj.id];
      const keep = newer(lj, rj);
      const sl = byId(lj.services);
      for(const rs of rj.services){
        if(!sl[rs.id]){ sl[rs.id]=rs; continue; }
        const ls = sl[rs.id];
        const cl = byId(ls.contacts);
        for(const rc of rs.contacts){
          if(!cl[rc.id]){ cl[rc.id]=rc; continue; }
          const lc = cl[rc.id];
          cl[rc.id] = {...newer(lc,rc),
            ok:Math.max(lc.ok||0,rc.ok||0), ko:Math.max(lc.ko||0,rc.ko||0),
            lastOk:Math.max(lc.lastOk||0,rc.lastOk||0)||null,
            lastTry:Math.max(lc.lastTry||0,rc.lastTry||0)||null};
        }
        ls.contacts = Object.values(cl);
        ls.nom = newer(ls,rs).nom;
      }
      lj.services = Object.values(sl);
      lj.nom = keep.nom; lj.categorie = keep.categorie; lj.adresse = keep.adresse;
    }
    let js = Object.values(jl).filter(j=>!(tomb[j.id]>(j.u||0)));
    for(const j of js){
      j.services = j.services.filter(s=>!(tomb[s.id]>(s.u||0)));
      for(const s of j.services)
        s.contacts = s.contacts.filter(c=>!(tomb[c.id]>(c.u||0)));
    }
    DATA.juridictions = js;
    DATA.tombstones = tomb;
    return true;
  }
  async function pull(interactive){
    if(!on()) return;
    const t = await ensureToken(interactive); if(!t){ setState('err','hors ligne'); return; }
    setState('work','sync…'); busy = true;
    try{
      if(!await findOrCreate(t)){ setState('err','erreur Drive'); return; }
      const m = await meta(t);
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,{headers:H(t)});
      if(r.ok){
        const remote = await r.json().catch(()=>null);
        if(remote && mergeData(remote)){
          buildIndex();
          try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){}
          renderChips(); render();
        }
        lastRemoteRev = m?.version||null;
        await push(true);
        setState('on','synchronisé');
      } else setState('err','erreur lecture');
    } finally { busy = false; }
  }
  async function push(skipCheck){
    if(!on() || !fileId) return;
    const t = await ensureToken(false); if(!t){ setState('err','reconnexion requise'); return; }
    setState('work','envoi…');
    if(!skipCheck){
      const m = await meta(t);
      if(m && lastRemoteRev && m.version!==lastRemoteRev){ await pull(false); return; }
    }
    const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media&fields=version`,{
      method:'PATCH', headers:{...H(t),'Content-Type':'application/json'}, body:exportJson()});
    if(r.ok){ lastRemoteRev = (await r.json()).version; setState('on','synchronisé'); }
    else setState('err','erreur envoi');
  }
  function schedulePush(){
    if(!on()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(()=>{ if(!busy) push(false); }, 2500);
  }
  async function connect(){
    const t = await ensureToken(true);
    if(!t){ toast('Connexion Google refusée'); return; }
    localStorage.setItem(LS_DRIVE,'1');
    refreshSettingsUI();
    await pull(false);
    toast('Google Drive connecté ☁️');
  }
  function disconnect(){
    localStorage.removeItem(LS_DRIVE); localStorage.removeItem(LS_FILEID);
    localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_HINT);
    fileId=null; token=null;
    setState('','local'); refreshSettingsUI();
  }
  function init(){
    if(!enabled()){ setState('','local'); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = ()=>{ if(on()) pull(false); };
    document.head.appendChild(s);
    if(!on()) setState('','local');
    document.addEventListener('visibilitychange', ()=>{
      if(!document.hidden && on() && !busy) pull(false);
    });
    setInterval(()=>{ if(on() && !busy && !document.hidden) pull(false); }, 5*60*1000);
  }
  return {init, connect, disconnect, schedulePush, refreshSettingsUI};
})();
$('#btnDrive').addEventListener('click', ()=>Drive.connect());
$('#btnDriveOff').addEventListener('click', ()=>{ Drive.disconnect(); toast('Drive déconnecté'); });
// l'indicateur de synchronisation sert de bouton de reconnexion en cas d'erreur
$('#syncstate').addEventListener('click', ()=>{
  if($('#syncstate').classList.contains('err')) Drive.connect();
});

  if(m && DATA.juridictions.some(j=>j.id===m[1])) ficheId = m[1];
  renderChips(); render();
  Drive.init();
})();
</script>
